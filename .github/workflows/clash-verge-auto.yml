name: Clash Verge Auto

on:
  schedule:
    # Refresh existing subscriptions at 06:17 / 12:17 / 18:17 UTC.
    - cron: "17 6-23/6 * * *"
    # Rebuild the source list daily at 00:17 UTC / 08:17 Asia-Shanghai.
    # Free airport trials usually expire within 1-3 days, so re-register every day.
    # NOTE: keep this cron string in sync with the check in the "Choose run mode" step.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto chooses refresh normally and collect on the daily 00:17 UTC run."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - refresh
          - collect
      alive_check:
        description: "Run Clash liveness checks before publishing."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      full_fork_scan:
        description: "Scan every historical GitHub fork page (slow maintenance run)."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: clash-verge-auto
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  OUTPUT_BRANCH: clash-verge-output
  PROFILE_FILE: clash.yaml
  REQUESTED_MODE: ${{ github.event.inputs.mode || 'auto' }}
  REQUESTED_ALIVE_CHECK: ${{ github.event.inputs.alive_check || 'true' }}
  FULL_FORK_SCAN: ${{ github.event.inputs.full_fork_scan || 'false' }}
  FORK_SCAN_PAGES: ${{ vars.FORK_SCAN_PAGES || '2' }}
  SCHEDULE_NAME: ${{ github.event.schedule || '' }}
  GH_TOKEN: ${{ github.token }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS || 'true' }}
  # Rotate through the large airport pool instead of re-registering all ~2000
  # historical domains every day. Successful sites are always prioritized.
  AIRPORT_MAX_DOMAINS: ${{ vars.AIRPORT_MAX_DOMAINS || '192' }}
  AIRPORT_DISCOVERY_MAX_DOMAINS: ${{ vars.AIRPORT_DISCOVERY_MAX_DOMAINS || '256' }}
  # The final profile is never published unless every retained proxy passes all
  # required sites and the result remains above this safety floor.
  GMGN_CHECK_URL: ${{ vars.GMGN_CHECK_URL || 'https://gmgn.ai/' }}
  STRICT_MIN_NODES: ${{ vars.STRICT_MIN_NODES || '20' }}
  STRICT_MIN_RETAIN_RATIO: ${{ vars.STRICT_MIN_RETAIN_RATIO || '0.25' }}
  # Optional self-hosted mainland-China TCP probe (Aliyun FC). Without this
  # secret, GitHub skips the China-side prefilter and keeps the full candidate set.
  PROBE_URL: ${{ secrets.PROBE_URL }}
  PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip3 install -r requirements.lock

      - name: Restore previous data
        run: |
          mkdir -p data
          git fetch origin "${OUTPUT_BRANCH}:refs/remotes/origin/${OUTPUT_BRANCH}" --depth=1 || true

          # crawler-subs.json / crawler-proxies.txt carry the crawler's accumulated
          # subscription pool across runs; without them every run starts cold.
          for name in subscribes.txt domains.txt valid-domains.txt crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json cn-fc-check.json; do
            if git show "origin/${OUTPUT_BRANCH}:${name}" > "/tmp/${name}" 2>/dev/null; then
              cp "/tmp/${name}" "data/${name}"
              echo "Restored ${name} from ${OUTPUT_BRANCH}."
            fi
          done

          if git show "origin/${OUTPUT_BRANCH}:status.json" > /tmp/previous-status.json 2>/dev/null; then
            cp /tmp/previous-status.json data/previous-status.json
            echo "Restored the previous publish status for strict-filter safeguards."
          fi

      - name: Build manual subscription config
        id: manual
        shell: bash
        env:
          CLASH_SUBSCRIPTIONS_SECRET: ${{ secrets.CLASH_SUBSCRIPTIONS }}
          CLASH_SUBSCRIPTION_URL_SECRET: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          raw = os.environ.get("CLASH_SUBSCRIPTIONS_SECRET", "")

          remote = os.environ.get("CLASH_SUBSCRIPTION_URL_SECRET", "")
          if remote:
              req = urllib.request.Request(remote, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw += "\n" + resp.read().decode("utf-8", errors="ignore")

          urls = []
          seen = set()
          for line in raw.replace("\r", "\n").split("\n"):
              for part in re.split(r"[\s,]+", line):
                  url = part.strip().strip("'\"<>").rstrip(",;)]")
                  if not url.startswith(("http://", "https://")):
                      continue
                  if url not in seen:
                      urls.append(url)
                      seen.add(url)

          if not urls:
              print("manual=false")
              sys.exit(0)

          config = {
              "domains": [
                  {
                      "name": "manual-subscriptions",
                      "sub": urls,
                      "enable": True,
                      "rename": "",
                      "include": "",
                      "exclude": "",
                      "push_to": ["clash-verge"],
                      "ignorede": True,
                      "liveness": True,
                      "rate": 20.0,
                      "secure": False,
                  }
              ],
              "crawl": {"enable": False},
              "groups": {
                  "clash-verge": {
                      "emoji": True,
                      "list": False,
                      "targets": {"clash": "clash-local"},
                  }
              },
              "storage": {
                  "engine": "local",
                  "items": {"clash-local": {"folderid": "", "fileid": "clash.yaml"}},
              },
              "delay": 10000,
          }

          os.makedirs("subscribe/config", exist_ok=True)
          with open("subscribe/config/clash-verge.generated.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)

          os.makedirs("data", exist_ok=True)
          with open("data/subscribes.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(urls) + "\n")

          print(f"manual=true count={len(urls)}")
          PY

          if [ -s subscribe/config/clash-verge.generated.json ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Choose run mode
        id: mode
        shell: bash
        run: |
          mode="${REQUESTED_MODE}"
          if [ "${mode}" = "auto" ]; then
            if [ "${SCHEDULE_NAME}" = "17 0 * * *" ]; then
              mode="collect"
            else
              mode="refresh"
            fi
          fi

          if [ "${{ steps.manual.outputs.enabled }}" = "true" ]; then
            mode="manual"
          elif [ ! -s data/subscribes.txt ]; then
            mode="collect"
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Selected mode: ${mode}"

      - name: Generate Clash profile from manual subscriptions
        if: steps.mode.outputs.mode == 'manual'
        shell: bash
        run: |
          mkdir -p data
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"

          if [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
            export SKIP_ALIVE_CHECK="false"
          else
            export SKIP_ALIVE_CHECK="true"
          fi

          python -u subscribe/process.py -s subscribe/config/clash-verge.generated.json --overwrite --invisible

          if [ ! -s "data/${PROFILE_FILE}" ]; then
            echo "Manual subscriptions did not produce data/${PROFILE_FILE}."
            exit 1
          fi

      - name: Generate Clash profile from collected sources
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"
          base_args=(--all --targets clash --num 64 --delay 10000 --easygoing --pages 3)
          fallback_args=(--all --targets clash --num 64 --delay 10000 --easygoing --skip --overwrite)

          if [ "${REQUESTED_ALIVE_CHECK}" != "true" ]; then
            base_args+=(--skip)
          fi

          run_mode="${{ steps.mode.outputs.mode }}"
          if [ "${run_mode}" = "refresh" ]; then
            base_args+=(--refresh)
          else
            base_args+=(--overwrite)
          fi

          set +e
          python -u subscribe/collect.py "${base_args[@]}"
          status=$?
          set -e

          if [ "${status}" -ne 0 ] || [ ! -s "data/${PROFILE_FILE}" ]; then
            if [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
              echo "Airport collection did not produce live nodes; continuing with crawler mode."
            else
              echo "Primary generation did not produce ${PROFILE_FILE}; trying a no-alive-check rebuild."
              set +e
              python -u subscribe/collect.py "${fallback_args[@]}"
              status=$?
              set -e
            fi
          fi

          if [ -s "data/${PROFILE_FILE}" ]; then
            cp "data/${PROFILE_FILE}" "data/collect-${PROFILE_FILE}"
          else
            echo "No airport collection profile available for merge."
          fi

      - name: Build crawler config
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          # Daily-updated community aggregator feeds (plain/base64 subscription files).
          # Prefer China-tested projects: the workflow runs on a US runner, which
          # cannot detect GFW-blocked entry IPs, so Iran-oriented feeds (barry-far,
          # Epodonios) look alive here but time out from China — they were removed
          # on 2026-07-23 after real-world testing. Drop entries that return 404.
          COMMUNITY_SUBS = [
              "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/v2ray.txt",
              "https://raw.githubusercontent.com/ripaojiedian/freenode/main/sub",
              "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub",
              "https://raw.githubusercontent.com/mfuu/v2ray/master/v2ray",
              "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.txt",
              "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.txt",
              # Added 2026-07-23 (active Chinese-community projects, files verified via API):
              "https://raw.githubusercontent.com/anaer/Sub/main/clash.yaml",
              "https://raw.githubusercontent.com/Jsnzkpg/Jsnzkpg/Jsnzkpg/Jsnzkpg",
              "https://raw.githubusercontent.com/free18/v2ray/main/v.txt",
              "https://raw.githubusercontent.com/Ruk1ng001/freeSub/main/v2ray",
              "https://raw.githubusercontent.com/shaoyouvip/free/main/base64.txt",
              "https://raw.githubusercontent.com/go4sharing/sub/main/sub.yaml",
              # Added 2026-07-23 round 2 (outputs live outside the repo root):
              # NOTE: Barabama publishes on a feature branch; drop if it starts 404ing.
              "https://raw.githubusercontent.com/Barabama/FreeNodes/refs/heads/feat/ai-crawler-v2/nodes/merged.yaml",
              "https://raw.githubusercontent.com/Leon406/SubCrawler/master/sub/share/v2",
              "https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta-2.yaml",
          ]

          # aiboboxx/clashfree (16k stars) rotates its file name daily
          # (clashYYYYMMDD.yml), so resolve the newest one at run time.
          try:
              import re
              import urllib.request

              req = urllib.request.Request(
                  "https://api.github.com/repos/aiboboxx/clashfree/contents/",
                  headers={
                      "User-Agent": "aggregator",
                      "Authorization": f"Bearer {os.environ.get('GH_TOKEN', '')}",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  entries = json.load(resp)
              names = sorted(e["name"] for e in entries if re.match(r"^clash\d{8}\.ya?ml$", e.get("name", "")))
              if names:
                  COMMUNITY_SUBS.append(f"https://raw.githubusercontent.com/aiboboxx/clashfree/main/{names[-1]}")
                  print(f"aiboboxx/clashfree latest file: {names[-1]}")
          except Exception as exc:
              print(f"skip aiboboxx/clashfree: {exc}")

          config = {
              "domains": [
                  {
                      "name": "community-aggregators",
                      "sub": COMMUNITY_SUBS,
                      "enable": True,
                      "rename": "",
                      "include": "",
                      "exclude": "",
                      "push_to": ["crawler"],
                      "ignorede": True,
                      "liveness": True,
                      "rate": 20.0,
                      "secure": False,
                  }
              ],
              "crawl": {
                  "enable": True,
                  "threshold": 10,
                  "singlelink": True,
                  "persist": {
                      "subs": "crawler-subs-store",
                      "proxies": "crawler-proxies-store",
                  },
                  "config": {
                      "rename": "",
                      "include": "",
                      "exclude": "",
                      "push_to": ["crawler"],
                      "ignorede": True,
                      "liveness": True,
                      "rate": 20.0,
                      "secure": False,
                  },
                  "github": {
                      "enable": True,
                      "pages": 6,
                      "push_to": ["crawler"],
                      "exclude": "",
                      "spams": [],
                  },
                  "duckduckgo": {
                      "enable": True,
                      "limits": 30,
                      "push_to": ["crawler"],
                      "exclude": "",
                      "notinurl": ["github.com", "githubusercontent.com"],
                  },
                  "yahoo": {
                      "enable": True,
                      "limits": 30,
                      "push_to": ["crawler"],
                      "exclude": "",
                      "notinurl": ["github.com", "githubusercontent.com"],
                  },
                  "google": {
                      "enable": True,
                      "limits": 100,
                      "qdr": 30,
                      "push_to": ["crawler"],
                      "exclude": "",
                      "notinurl": ["github.com", "githubusercontent.com"],
                  },
                  "yandex": {
                      "enable": True,
                      "pages": 1,
                      "within": 30,
                      "push_to": ["crawler"],
                      "exclude": "",
                      "notinurl": ["github.com", "githubusercontent.com"],
                  },
                  "telegram": {
                      "enable": True,
                      "pages": 12,
                      "limits": 50,
                      "users": {
                          "v2raydailyupdate": {
                              "enable": True,
                              "include": "|(?:vmess|trojan|ss|ssr|snell|hysteria2|vless|hysteria|tuic|anytls)://[a-zA-Z0-9:.?+=@%&#_\\-/]{10,}",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "vmessorg": {
                              "enable": True,
                              "include": "|(?:vmess|trojan|ss|ssr|snell|hysteria2|vless|hysteria|tuic|anytls)://[a-zA-Z0-9:.?+=@%&#_\\-/]{10,}",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "PrivateVPNs": {
                              "enable": True,
                              "include": "|(?:vmess|trojan|ss|ssr|snell|hysteria2|vless|hysteria|tuic|anytls)://[a-zA-Z0-9:.?+=@%&#_\\-/]{10,}",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "freev2rayssr": {
                              "enable": True,
                              "include": "|(?:vmess|trojan|ss|ssr|snell|hysteria2|vless|hysteria|tuic|anytls)://[a-zA-Z0-9:.?+=@%&#_\\-/]{10,}",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "proxy_mtm": {
                              "enable": True,
                              "include": "|(?:vmess|trojan|ss|ssr|snell|hysteria2|vless|hysteria|tuic|anytls)://[a-zA-Z0-9:.?+=@%&#_\\-/]{10,}",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "proxystore11": {
                              "enable": True,
                              "include": "|(?:vmess|trojan|ss|ssr|snell|hysteria2|vless|hysteria|tuic|anytls)://[a-zA-Z0-9:.?+=@%&#_\\-/]{10,}",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                      },
                  },
                  "twitter": {
                      "enable": True,
                      "users": {
                          "v2raydailyupdate": {
                              "enable": True,
                              "num": 200,
                              "include": "",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "vpnfail": {
                              "enable": True,
                              "num": 200,
                              "include": "",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "freevpn724": {
                              "enable": True,
                              "num": 200,
                              "include": "",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "V2rayCollector": {
                              "enable": True,
                              "num": 200,
                              "include": "",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                          "freev2raydaily": {
                              "enable": True,
                              "num": 200,
                              "include": "",
                              "exclude": "",
                              "config": {"push_to": ["crawler"], "ignorede": True, "liveness": True, "rate": 20.0},
                              "push_to": ["crawler"],
                          },
                      },
                  },
                  "repositories": [],
                  "pages": [],
                  "scripts": [
                      {
                          "enable": True,
                          "script": "gitforks#collect_subs",
                          "params": {
                              "username": "wzdnzd",
                              "repository": "aggregator",
                              "sort": "newest",
                              "max_pages": int(os.environ.get("FORK_SCAN_PAGES", "2")),
                              "full_scan": os.environ.get("FULL_FORK_SCAN", "false").lower() == "true",
                              "persist": {"folderid": "", "fileid": "crawler-gitfork-subs.txt"},
                              "config": {
                                  "push_to": ["crawler"],
                                  "ignorede": True,
                                  "liveness": True,
                                  "rate": 20.0,
                              },
                              "remain": 0,
                              "life": 0,
                          },
                      },
                      {
                          "enable": True,
                          "script": "v2rayse#fetch",
                          "params": {
                              "url": "https://s3.v2rayse.com",
                              "nodebuf_url": "https://nodebuf.com/api/public/proxy-cache",
                              "nodebuf_max_nodes": 100,
                              "nopublic": True,
                              "types": ["ss", "ssr", "vmess", "trojan", "tuic", "snell", "vless", "hysteria2", "hysteria", "http", "socks5", "anytls"],
                              "persist": {
                                  "proxies": {"folderid": "", "fileid": "crawler-v2rayse.txt"},
                                  "modified": {"folderid": "", "fileid": "crawler-v2rayse-modified.json"},
                              },
                              "config": {
                                  "push_to": ["crawler"],
                                  "ignorede": True,
                                  "liveness": True,
                                  "rate": 20.0,
                              },
                          },
                      },
                  ],
              },
              "groups": {
                  "crawler": {
                      "emoji": True,
                      "list": False,
                      "targets": {"clash": "crawler-clash-local"},
                  }
              },
              "storage": {
                  "engine": "local",
                  "items": {
                      "crawler-clash-local": {"folderid": "", "fileid": "crawler-clash.yaml"},
                      "crawler-subs-store": {"folderid": "", "fileid": "crawler-subs.json"},
                      "crawler-proxies-store": {"folderid": "", "fileid": "crawler-proxies.txt"},
                  },
              },
              "delay": 10000,
          }

          os.makedirs("subscribe/config", exist_ok=True)
          with open("subscribe/config/clash-verge-crawler.generated.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
          PY

      - name: Generate Clash profile from crawlers
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"

          if [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
            export SKIP_ALIVE_CHECK="false"
          else
            export SKIP_ALIVE_CHECK="true"
          fi

          set +e
          python -u subscribe/process.py -s subscribe/config/clash-verge-crawler.generated.json --overwrite --flexible --invisible --timeout 10000 --num 128
          status=$?
          set -e

          if [ "${status}" -ne 0 ]; then
            echo "Crawler generation failed; keeping airport collection output."
          elif [ ! -s "data/crawler-clash.yaml" ]; then
            echo "Crawler generation produced no Clash profile; keeping airport collection output."
          fi

      - name: Merge collected and crawled profiles
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.path.abspath("subscribe"))

          import yaml
          import clash

          output = os.path.join("data", os.environ.get("PROFILE_FILE", "clash.yaml"))
          sources = [
              os.path.join("data", "collect-clash.yaml"),
              os.path.join("data", "crawler-clash.yaml"),
          ]
          proxies = []

          for source in sources:
              if not os.path.exists(source) or os.path.getsize(source) <= 0:
                  continue

              with open(source, "r", encoding="utf-8", errors="ignore") as f:
                  try:
                      data = yaml.load(f, Loader=yaml.SafeLoader) or {}
                  except Exception:
                      data = {}

              items = data.get("proxies", [])
              if isinstance(items, list):
                  proxies.extend([p for p in items if isinstance(p, dict)])
                  print(f"{source}: {len(items)} proxies")

          if not proxies:
              print("No proxies found to merge.")
              sys.exit(1)

          config = {
              "mixed-port": 7890,
              "external-controller": clash.EXTERNAL_CONTROLLER,
              "mode": "Rule",
              "log-level": "silent",
          }
          config.update(clash.filter_proxies(proxies))

          # Align the auto-select group's probe with what the user actually needs.
          for group in config.get("proxy-groups", []):
              if group.get("type") == "url-test":
                  group["url"] = os.environ.get("GMGN_CHECK_URL", "https://gmgn.ai/")

          with open(output, "w", encoding="utf-8") as f:
              yaml.add_representer(clash.QuotedStr, clash.quoted_scalar)
              yaml.dump(config, f, allow_unicode=True)

          print(f"merged {len(proxies)} source proxies into {len(config.get('proxies', []))} unique proxies")
          PY

      - name: Drop GFW-blocked entries via configured China-side probe
        if: env.PROBE_URL != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          sys.path.insert(0, os.path.abspath("subscribe"))

          import yaml
          import clash

          # This cache is FC-specific so historical Globalping results can never
          # remove nodes after the Globalping filter has been disabled.
          CACHE_FILE = os.path.join("data", "cn-fc-check.json")
          CACHE_DAYS = 7
          # Leave protocols that are not reliably classified by this probe unchecked.
          SKIP_TYPES = {"ss", "ssr", "tuic", "hysteria", "hysteria2", "snell", "http", "socks5"}

          profile = os.path.join("data", os.environ.get("PROFILE_FILE", "clash.yaml"))
          now = time.time()

          with open(profile, "r", encoding="utf-8", errors="ignore") as f:
              data = yaml.load(f, Loader=yaml.SafeLoader) or {}
          proxies = [p for p in data.get("proxies", []) if isinstance(p, dict)]
          if not proxies:
              print("No proxies found; skip China-side probe.")
              sys.exit(0)

          cache = {}
          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE, "r", encoding="utf-8") as f:
                      cache = json.load(f)
              except Exception:
                  cache = {}
          cache = {k: v for k, v in cache.items() if now - v.get("ts", 0) < CACHE_DAYS * 86400}

          endpoints = {}
          for p in proxies:
              if str(p.get("type", "")).lower() in SKIP_TYPES:
                  continue
              key = f"{p.get('server')}:{p.get('port')}"
              endpoints.setdefault(key, (str(p.get("server")), int(p.get("port", 0))))

          PROBE_URL = os.environ.get("PROBE_URL", "")
          PROBE_TOKEN = os.environ.get("PROBE_TOKEN", "")

          # Self-hosted Aliyun FC probe: mainland-China datacenter view, no
          # third-party quota, full synchronous batch TCP handshake.
          todo = [k for k in endpoints if k not in cache]
          print(f"cn-check(FC): {len(endpoints)} endpoints, {len(todo)} new to probe, cache {len(cache)}")
          CHUNK = 500
          for i in range(0, len(todo), CHUNK):
              batch = todo[i:i + CHUNK]
              r = urllib.request.Request(
                  PROBE_URL,
                  data=json.dumps({"endpoints": batch, "timeout": 3.0}).encode(),
                  headers={"Content-Type": "application/json", "X-Probe-Token": PROBE_TOKEN},
              )
              try:
                  with urllib.request.urlopen(r, timeout=120) as resp:
                      res = json.loads(resp.read().decode())
              except Exception as e:
                  print(f"::warning::FC probe failed ({e}); keeping unprobed endpoints this round")
                  break
              for ep, ok in (res.get("ok") or {}).items():
                  cache[ep] = {"ok": bool(ok), "ts": now}

          os.makedirs("data", exist_ok=True)
          with open(CACHE_FILE, "w", encoding="utf-8") as f:
              json.dump(cache, f, indent=1, sort_keys=True)

          blocked = {k for k, v in cache.items() if not v.get("ok")}
          kept, dropped = [], 0
          for p in proxies:
              key = f"{p.get('server')}:{p.get('port')}"
              if str(p.get("type", "")).lower() not in SKIP_TYPES and key in blocked:
                  dropped += 1
                  continue
              kept.append(p)

          line = f"cn-check: dropped {dropped} GFW-blocked, kept {len(kept)}/{len(proxies)} (blocked cache {len(blocked)})"
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(f"### China-side probe\n- {line}\n")

          if not dropped or not kept:
              sys.exit(0)

          config = {
              "mixed-port": 7890,
              "external-controller": clash.EXTERNAL_CONTROLLER,
              "mode": "Rule",
              "log-level": "silent",
          }
          config.update(clash.filter_proxies(kept))
          for group in config.get("proxy-groups", []):
              if group.get("type") == "url-test":
                  group["url"] = os.environ.get("GMGN_CHECK_URL", "https://gmgn.ai/")

          with open(profile, "w", encoding="utf-8") as f:
              yaml.add_representer(clash.QuotedStr, clash.quoted_scalar)
              yaml.dump(config, f, allow_unicode=True)
          PY

      - name: Filter proxies by required site reachability
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import subprocess
          import sys
          import time
          import urllib.parse

          sys.path.insert(0, os.path.abspath("subscribe"))

          import yaml
          import clash
          import executable
          import utils

          # Every published proxy must reach ALL of these targets with the
          # expected status code (Cloudflare rejects dirty IPs with 403).
          TARGETS = [
              (os.environ.get("GMGN_CHECK_URL", "https://gmgn.ai/"), 200),
              ("https://www.google.com/generate_204", 204),
              ("https://www.youtube.com/generate_204", 204),
          ]

          profile = os.path.join("data", os.environ.get("PROFILE_FILE", "clash.yaml"))
          previous_status = os.path.join("data", "previous-status.json")

          def fail_closed(message, lines=None):
              print(f"::error::{message}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write("### Reachability filter\n")
                      for line in lines or []:
                          f.write(f"- {line}\n")
                      f.write(f"- FAILED CLOSED: {message}\n")
              raise RuntimeError(message)

          def integer_setting(name, default):
              try:
                  return max(int(os.environ.get(name, str(default))), 1)
              except Exception:
                  return default

          def ratio_setting(name, default):
              try:
                  return min(max(float(os.environ.get(name, str(default))), 0.0), 1.0)
              except Exception:
                  return default

          previous_count = 0
          try:
              with open(previous_status, "r", encoding="utf-8") as f:
                  previous_count = max(int((json.load(f) or {}).get("proxy_count", 0)), 0)
          except Exception:
              previous_count = 0

          with open(profile, "r", encoding="utf-8", errors="ignore") as f:
              data = yaml.load(f, Loader=yaml.SafeLoader) or {}

          proxies = [p for p in data.get("proxies", []) if isinstance(p, dict)]
          if not proxies:
              fail_closed("the candidate profile contains no proxies; keeping the previous published profile")

          # Re-validate after merging YAML files. This also restores quoted
          # scalar types for numeric-looking REALITY short IDs such as "08";
          # without it, Mihomo rejects the entire generated test config.
          validated = []
          for proxy in proxies:
              try:
                  if clash.verify(proxy, mihomo=True):
                      validated.append(proxy)
              except Exception:
                  pass
          invalid_count = len(proxies) - len(validated)
          if invalid_count:
              print(f"config validation: dropped {invalid_count} malformed proxies")
          if not validated:
              fail_closed("all candidate proxies failed config validation; keeping the previous published profile")

          workspace = os.path.join(os.getcwd(), "clash")
          clash_bin, _ = executable.which_bin()
          binpath = os.path.join(workspace, clash_bin)
          utils.chmod(binpath)

          # generate_config dedupes and renames proxies; use its returned list so
          # the names we query through the REST API match the running config.
          checks = clash.generate_config(workspace, validated, "reach-check.yaml")
          if not checks:
              fail_closed("Mihomo test configuration contains no valid proxies")

          def reachable(proxy, target, expected):
              name = urllib.parse.quote(proxy.get("name", ""), safe="")
              quoted = urllib.parse.quote(target)
              url = f"http://{clash.EXTERNAL_CONTROLLER}/proxies/{name}/delay?timeout=3000&url={quoted}&expected={expected}"
              content = utils.http_get(url=url, retry=2, interval=0.1)
              try:
                  return json.loads(content).get("delay", -1) > 0
              except Exception:
                  return False

          process = None
          lines, valid_masks = [], []
          try:
              process = subprocess.Popen(
                  [binpath, "-d", workspace, "-f", os.path.join(workspace, "reach-check.yaml")]
              )
              time.sleep(8)
              if process.poll() is not None:
                  fail_closed(f"Mihomo exited before reachability checks (code {process.returncode})", lines)

              for target, expected in TARGETS:
                  masks = utils.multi_thread_run(
                      func=reachable,
                      tasks=[[p, target, expected] for p in checks],
                      num_threads=128,
                      show_progress=False,
                  )
                  if not isinstance(masks, list) or len(masks) != len(checks):
                      fail_closed(f"incomplete reachability results for {target}", lines)

                  count = sum(1 for m in masks if m)
                  lines.append(f"{target}: {count}/{len(checks)} proxies reachable")
                  print(lines[-1])
                  if count <= 0:
                      fail_closed(
                          f"no proxy passed {target}; treating the target check as unavailable",
                          lines,
                      )
                  valid_masks.append(masks)
          finally:
              if process is not None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)

          passed = [checks[i] for i in range(len(checks)) if all(m[i] for m in valid_masks)]
          lines.append(f"kept {len(passed)}/{len(checks)} proxies")
          print(f"reachability filter: kept {len(passed)}/{len(checks)} proxies")

          minimum = integer_setting("STRICT_MIN_NODES", 20)
          ratio = ratio_setting("STRICT_MIN_RETAIN_RATIO", 0.25)
          required = max(minimum, math.ceil(previous_count * ratio))
          lines.append(
              f"publish floor: {required} proxies (previous={previous_count}, minimum={minimum}, ratio={ratio:.2f})"
          )

          if len(passed) < required:
              fail_closed(
                  f"only {len(passed)} proxies passed all required sites; at least {required} are required",
                  lines,
              )

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("### Reachability filter\n" + "".join(f"- {l}\n" for l in lines))

          config = {
              "mixed-port": 7890,
              "external-controller": clash.EXTERNAL_CONTROLLER,
              "mode": "Rule",
              "log-level": "silent",
          }
          config.update(clash.filter_proxies(passed))

          # Align the auto-select group's probe with what the user actually needs.
          for group in config.get("proxy-groups", []):
              if group.get("type") == "url-test":
                  group["url"] = os.environ.get("GMGN_CHECK_URL", "https://gmgn.ai/")

          with open(profile, "w", encoding="utf-8") as f:
              yaml.add_representer(clash.QuotedStr, clash.quoted_scalar)
              yaml.dump(config, f, allow_unicode=True)
          PY

      - name: Prepare publish files
        shell: bash
        run: |
          mkdir -p public
          cp "data/${PROFILE_FILE}" "public/${PROFILE_FILE}"

          for name in subscribes.txt domains.txt valid-domains.txt collect-clash.yaml crawler-clash.yaml crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json crawler-v2rayse.txt crawler-v2rayse-modified.json cn-fc-check.json; do
            # Never publish manual subscription URLs: they may embed private tokens.
            if [ "${name}" = "subscribes.txt" ] && [ "${{ steps.mode.outputs.mode }}" = "manual" ]; then
              echo "Skip publishing subscribes.txt in manual mode."
              continue
            fi
            if [ -f "data/${name}" ]; then
              cp "data/${name}" "public/${name}"
            fi
          done

          run_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}/${PROFILE_FILE}"
          proxy_count="$(python - <<'PY'
          import os
          import yaml

          filename = os.path.join("data", os.environ.get("PROFILE_FILE", "clash.yaml"))
          try:
              with open(filename, "r", encoding="utf-8", errors="ignore") as f:
                  data = yaml.load(f, Loader=yaml.SafeLoader) or {}
              print(len(data.get("proxies", [])))
          except Exception:
              print(0)
          PY
          )"
          printf "%s\n" "${run_at}" > public/last-run.txt
          printf '{"run_at":"%s","mode":"%s","alive_check":"%s","proxy_count":%s,"profile_url":"%s"}\n' "${run_at}" "${{ steps.mode.outputs.mode }}" "${REQUESTED_ALIVE_CHECK}" "${proxy_count}" "${url}" > public/status.json
          cat > public/README.md <<EOF
          # Clash Verge Auto Profile

          Subscription URL:

          ${url}

          Last run: ${run_at}
          EOF

      - name: Publish profile branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the branch as a single orphan commit each run: the profile is
          # ~1MB per publish and an append-only history would grow the repo by
          # gigabytes per year. Raw URLs always resolve to the branch tip, so
          # consumers are unaffected by the force push.
          publish_dir="$(mktemp -d)"
          git worktree add --detach "${publish_dir}"
          cd "${publish_dir}"
          git switch --orphan "${OUTPUT_BRANCH}"
          git reset
          cd "${GITHUB_WORKSPACE}"

          cp public/README.md "${publish_dir}/README.md"
          cp "public/${PROFILE_FILE}" "${publish_dir}/${PROFILE_FILE}"
          cp public/last-run.txt "${publish_dir}/last-run.txt"
          cp public/status.json "${publish_dir}/status.json"

          for name in subscribes.txt domains.txt valid-domains.txt collect-clash.yaml crawler-clash.yaml crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json crawler-v2rayse.txt crawler-v2rayse-modified.json cn-fc-check.json; do
            if [ -f "public/${name}" ]; then
              cp "public/${name}" "${publish_dir}/${name}"
            fi
          done

          cd "${publish_dir}"
          git add README.md "${PROFILE_FILE}" last-run.txt status.json
          for name in subscribes.txt domains.txt valid-domains.txt collect-clash.yaml crawler-clash.yaml crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json crawler-v2rayse.txt crawler-v2rayse-modified.json cn-fc-check.json; do
            if [ -f "${name}" ]; then
              git add "${name}"
            fi
          done
          git commit -m "Update Clash Verge profile" --allow-empty
          git push --force origin "HEAD:${OUTPUT_BRANCH}"

      - name: Summary
        shell: bash
        run: |
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}/${PROFILE_FILE}"
          echo "### Clash Verge subscription" >> "${GITHUB_STEP_SUMMARY}"
          echo "${url}" >> "${GITHUB_STEP_SUMMARY}"
