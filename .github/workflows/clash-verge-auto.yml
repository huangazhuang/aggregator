name: Clash Verge Auto

on:
  schedule:
    # Refresh existing subscriptions at 06:17 / 12:17 / 18:17 UTC.
    - cron: "17 6-23/6 * * *"
    # Rebuild the source list daily at 00:17 UTC / 08:17 Asia-Shanghai.
    # Free airport trials usually expire within 1-3 days, so re-register every day.
    # NOTE: keep this cron string in sync with the check in the "Choose run mode" step.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto chooses refresh normally and collect on the daily 00:17 UTC run."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - refresh
          - collect
      alive_check:
        description: "Run Clash liveness checks before publishing."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      full_fork_scan:
        description: "Scan every historical GitHub fork page (slow maintenance run)."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      candidate_v2:
        description: "Build the candidate snapshot V2 through isolated collection/identity/publish jobs."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: clash-verge-auto
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  OUTPUT_BRANCH: clash-verge-output
  CANDIDATE_STAGING_BRANCH: clash-verge-output-staging
  PROFILE_FILE: clash.yaml
  REQUESTED_MODE: ${{ github.event.inputs.mode || 'auto' }}
  REQUESTED_ALIVE_CHECK: ${{ github.event.inputs.alive_check || 'true' }}
  FULL_FORK_SCAN: ${{ github.event.inputs.full_fork_scan || 'false' }}
  ENABLE_CANDIDATE_V2: ${{ github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false' }}
  CANDIDATE_RUNTIME_KEY_EPOCH: ${{ vars.CANDIDATE_RUNTIME_KEY_EPOCH || 'runtime-key-v1' }}
  ENABLE_ASIA_SOURCE_AWESOME_VPN: ${{ vars.ENABLE_ASIA_SOURCE_AWESOME_VPN || 'false' }}
  FORK_SCAN_PAGES: ${{ vars.FORK_SCAN_PAGES || '2' }}
  SCHEDULE_NAME: ${{ github.event.schedule || '' }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS || 'true' }}
  # Rotate through the large airport pool instead of re-registering all ~2000
  # historical domains every day. Successful sites are always prioritized.
  AIRPORT_MAX_DOMAINS: ${{ vars.AIRPORT_MAX_DOMAINS || '192' }}
  AIRPORT_DISCOVERY_MAX_DOMAINS: ${{ vars.AIRPORT_DISCOVERY_MAX_DOMAINS || '256' }}
  # The final profile is never published unless every retained proxy passes all
  # required sites and the result remains above this safety floor.
  GMGN_CHECK_URL: ${{ vars.GMGN_CHECK_URL || 'https://gmgn.ai/' }}
  STRICT_MIN_NODES: ${{ vars.STRICT_MIN_NODES || '20' }}
  STRICT_MIN_RETAIN_RATIO: ${{ vars.STRICT_MIN_RETAIN_RATIO || '0.25' }}
jobs:
  collect:
    permissions:
      contents: read
    outputs:
      observed_output_tip: ${{ steps.previous.outputs.observed_output_tip }}
    env:
      GH_TOKEN: ${{ github.token }}
      PROBE_URL: ${{ secrets.PROBE_URL }}
      PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip3 install -r requirements.lock

      - name: Run pipeline unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore encrypted private collection state cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: candidate-runtime-state/runtime-state.enc
          key: candidate-runtime-state-v2-${{ github.repository }}-${{ env.CANDIDATE_RUNTIME_KEY_EPOCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            candidate-runtime-state-v2-${{ github.repository }}-${{ env.CANDIDATE_RUNTIME_KEY_EPOCH }}-

      - name: Decrypt private collection state cache
        id: runtime-decrypt
        if: steps.runtime-cache.outputs.cache-matched-key != ''
        env:
          CANDIDATE_HANDOFF_AES_KEY: ${{ secrets.CANDIDATE_HANDOFF_AES_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE_HANDOFF_AES_KEY}" ]; then
            echo "CANDIDATE_HANDOFF_AES_KEY is required to restore private collection state." >&2
            exit 1
          fi
          set +e
          python -m scripts.candidate_runtime_state decrypt \
            --input candidate-runtime-state/runtime-state.enc \
            --output-dir data \
            --repository "${GITHUB_REPOSITORY}" \
            --key-epoch "${CANDIDATE_RUNTIME_KEY_EPOCH}"
          decrypt_rc=$?
          set -e
          if [ "${decrypt_rc}" -ne 0 ]; then
            echo "::warning::Encrypted private collection state was rejected; rebuilding from the last-good branch or a fresh collection."
            echo "invalid=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "restored=true" >> "${GITHUB_OUTPUT}"

      - name: Restore previous data
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          set +e
          previous_ref="$(git ls-remote --heads origin "refs/heads/${OUTPUT_BRANCH}")"
          lookup_rc=$?
          set -e
          if [ "${lookup_rc}" -ne 0 ]; then
            echo "Unable to determine whether ${OUTPUT_BRANCH} exists."
            exit 1
          fi

          previous_ref_count="$(printf '%s\n' "${previous_ref}" | sed '/^$/d' | wc -l)"
          if [ "${previous_ref_count}" -gt 1 ]; then
            echo "Previous ${OUTPUT_BRANCH} lookup was ambiguous."
            exit 1
          fi

          previous_tip="$(printf '%s\n' "${previous_ref}" | awk 'NF {print $1}')"
          echo "observed_output_tip=${previous_tip}" >> "${GITHUB_OUTPUT}"
          if [ -z "${previous_tip}" ]; then
            echo "confirmed_absent" > data/previous-ref-state.txt
          else
            git fetch origin "${OUTPUT_BRANCH}:refs/remotes/origin/${OUTPUT_BRANCH}" --depth=1
            fetched_tip="$(git rev-parse "refs/remotes/origin/${OUTPUT_BRANCH}")"
            if [ "${fetched_tip}" != "${previous_tip}" ]; then
              echo "Previous ${OUTPUT_BRANCH} changed while it was being restored."
              exit 1
            fi

            restore_required_previous_blob() {
              name="$1"
              destination="$2"
              entry="$(git ls-tree "${previous_tip}" -- "${name}")"
              if [ -z "${entry}" ]; then
                echo "Previous ${OUTPUT_BRANCH} is missing required ${name}."
                exit 1
              fi
              if [ "$(printf '%s\n' "${entry}" | sed '/^$/d' | wc -l)" -ne 1 ]; then
                echo "Previous ${OUTPUT_BRANCH} has an ambiguous ${name} entry."
                exit 1
              fi
              if [ "$(git cat-file -t "${previous_tip}:${name}")" != "blob" ]; then
                echo "Previous ${OUTPUT_BRANCH} ${name} is not a file."
                exit 1
              fi
              if ! git show "${previous_tip}:${name}" > "${destination}"; then
                echo "Unable to restore ${name} from ${OUTPUT_BRANCH}."
                exit 1
              fi
            }

            restore_required_previous_blob "${PROFILE_FILE}" "data/previous-${PROFILE_FILE}"
            restore_required_previous_blob "status.json" data/previous-status.json

            metadata_entry="$(git ls-tree "${previous_tip}" -- candidate-metadata.json)"
            if [ -z "${metadata_entry}" ]; then
              # The Python candidate validator decides whether this is the one
              # supported legacy V1 contract. A malformed or V2-looking status
              # cannot be downgraded merely because its metadata is absent.
              echo "legacy_v1" > data/previous-ref-state.txt
            else
              if [ "$(printf '%s\n' "${metadata_entry}" | sed '/^$/d' | wc -l)" -ne 1 ]; then
                echo "Previous ${OUTPUT_BRANCH} has an ambiguous candidate-metadata.json entry."
                exit 1
              fi
              restore_required_previous_blob candidate-metadata.json data/previous-candidate-metadata.json
              echo "present" > data/previous-ref-state.txt
            fi
          fi

          # One-way migration: historical output branches may still contain
          # private crawler/source runtime state. Import it only when no
          # authenticated cache was restored; it is never copied back into any
          # public artifact or output commit.
          if [ -n "${previous_tip}" ] && [ "${{ steps.runtime-decrypt.outputs.restored }}" != "true" ]; then
            restored_legacy_runtime=false
            for name in subscribes.txt domains.txt valid-domains.txt crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json crawler-v2rayse.txt crawler-v2rayse-modified.json cn-fc-check.json; do
              if [ "$(git cat-file -t "${previous_tip}:${name}" 2>/dev/null || true)" = "blob" ]; then
                git show "${previous_tip}:${name}" > "data/${name}"
                restored_legacy_runtime=true
              fi
            done
            if [ "${restored_legacy_runtime}" = "true" ]; then
              echo "Migrated legacy private collection state into the encrypted cache path."
            fi
          fi

          if [ -f data/previous-status.json ]; then
            echo "Restored the previous publish status for strict-filter safeguards."
          fi

      - name: Build manual subscription config
        id: manual
        shell: bash
        env:
          CLASH_SUBSCRIPTIONS_SECRET: ${{ secrets.CLASH_SUBSCRIPTIONS }}
          CLASH_SUBSCRIPTION_URL_SECRET: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
        run: |
          python -m scripts.build_manual_config

          if [ -s subscribe/config/clash-verge.generated.json ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Choose run mode
        id: mode
        shell: bash
        run: |
          mode="${REQUESTED_MODE}"
          if [ "${mode}" = "auto" ]; then
            if [ "${SCHEDULE_NAME}" = "17 0 * * *" ]; then
              mode="collect"
            else
              mode="refresh"
            fi
          fi

          if [ "${{ steps.manual.outputs.enabled }}" = "true" ]; then
            mode="manual"
          elif [ ! -s data/subscribes.txt ]; then
            mode="collect"
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Selected mode: ${mode}"

      - name: Generate Clash profile from manual subscriptions
        if: steps.mode.outputs.mode == 'manual'
        shell: bash
        env:
          CANDIDATE_PROVENANCE_FILE: data/manual-candidate-provenance.json
        run: |
          mkdir -p data
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"

          if [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
            export SKIP_ALIVE_CHECK="false"
          else
            export SKIP_ALIVE_CHECK="true"
          fi

          python -u subscribe/process.py -s subscribe/config/clash-verge.generated.json --overwrite --invisible

          if [ ! -s "data/${PROFILE_FILE}" ]; then
            echo "Manual subscriptions did not produce data/${PROFILE_FILE}."
            exit 1
          fi

      - name: Generate Clash profile from collected sources
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        env:
          CANDIDATE_PROVENANCE_FILE: data/collect-candidate-provenance.json
          PUBLISH_COLLECTED_DERIVATIVES: "true"
        run: |
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"
          base_args=(--all --targets clash --num 64 --delay 10000 --easygoing --pages 3)
          fallback_args=(--all --targets clash --num 64 --delay 10000 --easygoing --skip --overwrite)

          # Candidate V2 collects a broad pool first. No proxy endpoint may be
          # contacted until the dedicated endpoint sanitizer has run after the
          # collected/crawler profiles are merged.
          if [ "${ENABLE_CANDIDATE_V2}" = "true" ]; then
            base_args+=(--skip)
          fi

          if [ "${ENABLE_CANDIDATE_V2}" != "true" ] && [ "${REQUESTED_ALIVE_CHECK}" != "true" ]; then
            base_args+=(--skip)
          fi

          run_mode="${{ steps.mode.outputs.mode }}"
          if [ "${run_mode}" = "refresh" ]; then
            base_args+=(--refresh)
          else
            base_args+=(--overwrite)
          fi

          set +e
          python -u subscribe/collect.py "${base_args[@]}"
          status=$?
          set -e

          if [ "${ENABLE_CANDIDATE_V2}" = "true" ] && [ "${status}" -ne 0 ]; then
            echo "Candidate V2 airport collection failed; refusing a partial candidate snapshot." >&2
            exit "${status}"
          fi

          if [ "${status}" -ne 0 ] || [ ! -s "data/${PROFILE_FILE}" ]; then
            if [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
              echo "Airport collection did not produce live nodes; continuing with crawler mode."
            else
              echo "Primary generation did not produce ${PROFILE_FILE}; trying a no-alive-check rebuild."
              set +e
              python -u subscribe/collect.py "${fallback_args[@]}"
              status=$?
              set -e
            fi
          fi

          if [ "${ENABLE_CANDIDATE_V2}" = "true" ] && { [ "${status}" -ne 0 ] || [ ! -s "data/${PROFILE_FILE}" ]; }; then
            echo "Candidate V2 airport collection produced no complete profile." >&2
            exit 1
          fi

          if [ -s "data/${PROFILE_FILE}" ]; then
            cp "data/${PROFILE_FILE}" "data/collect-${PROFILE_FILE}"
          else
            echo "No airport collection profile available for merge."
          fi

      - name: Build crawler config
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          python -m scripts.build_crawler_config

      - name: Generate Clash profile from crawlers
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        env:
          CANDIDATE_PROVENANCE_FILE: data/crawler-candidate-provenance.json
        run: |
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"

          if [ "${ENABLE_CANDIDATE_V2}" = "true" ]; then
            export SKIP_ALIVE_CHECK="true"
          elif [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
            export SKIP_ALIVE_CHECK="false"
          else
            export SKIP_ALIVE_CHECK="true"
          fi

          set +e
          python -u subscribe/process.py -s subscribe/config/clash-verge-crawler.generated.json --overwrite --flexible --invisible --timeout 10000 --num 128
          status=$?
          set -e

          if [ "${ENABLE_CANDIDATE_V2}" = "true" ] && [ "${status}" -ne 0 ]; then
            echo "Candidate V2 crawler generation failed; refusing a partial candidate snapshot." >&2
            exit "${status}"
          fi

          if [ "${ENABLE_CANDIDATE_V2}" = "true" ] && [ ! -s "data/crawler-clash.yaml" ]; then
            echo "Candidate V2 crawler generation produced no Clash profile." >&2
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "Crawler generation failed; keeping airport collection output."
          elif [ ! -s "data/crawler-clash.yaml" ]; then
            echo "Crawler generation produced no Clash profile; keeping airport collection output."
          fi

      - name: Merge collected and crawled profiles
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          python -m scripts.merge_clash_profiles

      - name: Sanitize Candidate V2 endpoints before any proxy network access
        if: env.ENABLE_CANDIDATE_V2 == 'true'
        shell: bash
        run: |
          args=(--profile "data/${PROFILE_FILE}")
          found=false
          for name in collect-candidate-provenance.json crawler-candidate-provenance.json; do
            if [ -s "data/${name}" ]; then
              args+=(--provenance "data/${name}")
              found=true
            fi
          done
          if [ "${found}" != "true" ]; then
            echo "Candidate V2 endpoint sanitization has no provenance input." >&2
            exit 1
          fi
          python -m scripts.sanitize_candidate_endpoints \
            --rebuild-from-provenance \
            --safety-evidence data/candidate-endpoint-safety-evidence.json \
            "${args[@]}"
          cp "data/${PROFILE_FILE}" data/candidate-sanitized-clash.yaml

      - name: Drop GFW-blocked entries via configured China-side probe
        if: env.PROBE_URL != ''
        shell: bash
        run: |
          python -m scripts.apply_tcp_probe

      - name: Filter proxies by required site reachability
        shell: bash
        run: |
          python -m scripts.filter_reachability

      - name: Prepare publish files
        shell: bash
        run: |
          mkdir -p legacy-public
          cp "data/${PROFILE_FILE}" "legacy-public/${PROFILE_FILE}"

          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}/${PROFILE_FILE}"
          python -m scripts.prepare_github_publish \
            --profile "data/${PROFILE_FILE}" \
            --public-dir legacy-public \
            --profile-url "${url}" \
            --mode "${{ steps.mode.outputs.mode }}" \
            --alive-check "${REQUESTED_ALIVE_CHECK}" \
            --main-sha "${GITHUB_SHA}"
          python -m scripts.public_bundle validate --directory legacy-public --kind legacy

      - name: Encrypt private collection state for cache
        id: runtime-encrypt
        env:
          CANDIDATE_HANDOFF_AES_KEY: ${{ secrets.CANDIDATE_HANDOFF_AES_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE_HANDOFF_AES_KEY}" ]; then
            echo "CANDIDATE_HANDOFF_AES_KEY is required before private runtime state can be removed from the public branch." >&2
            exit 1
          fi
          python -m scripts.candidate_runtime_state encrypt \
            --input-dir data \
            --output candidate-runtime-state/runtime-state.enc \
            --repository "${GITHUB_REPOSITORY}" \
            --key-epoch "${CANDIDATE_RUNTIME_KEY_EPOCH}"
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Save encrypted private collection state cache
        if: steps.runtime-encrypt.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: candidate-runtime-state/runtime-state.enc
          key: candidate-runtime-state-v2-${{ github.repository }}-${{ env.CANDIDATE_RUNTIME_KEY_EPOCH }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare candidate V2 identity handoff
        if: env.ENABLE_CANDIDATE_V2 == 'true'
        shell: bash
        run: |
          mkdir -p candidate-private
          profile_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}/${PROFILE_FILE}"
          metadata_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}/candidate-metadata.json"
          args=(
            --profile "data/${PROFILE_FILE}"
            --output candidate-private/identity-input.json
            --mode "${{ steps.mode.outputs.mode }}"
            --main-sha "${GITHUB_SHA}"
            --profile-url "${profile_url}"
            --candidate-metadata-url "${metadata_url}"
            --previous-state "$(cat data/previous-ref-state.txt)"
            --github-check-report data/github-check-report.json
            --endpoint-safety-evidence data/candidate-endpoint-safety-evidence.json
            --sanitized-profile data/candidate-sanitized-clash.yaml
          )
          found=false
          for name in manual-candidate-provenance.json collect-candidate-provenance.json crawler-candidate-provenance.json; do
            if [ -s "data/${name}" ]; then
              args+=(--provenance "data/${name}")
              found=true
            fi
          done
          if [ "${found}" != "true" ]; then
            echo "No candidate provenance staging was produced."
            exit 1
          fi
          previous_state="$(cat data/previous-ref-state.txt)"
          case "${previous_state}" in
            present)
              args+=(
                --previous-profile "data/previous-${PROFILE_FILE}"
                --previous-status data/previous-status.json
                --previous-metadata data/previous-candidate-metadata.json
              )
              ;;
            legacy_v1)
              args+=(
                --previous-profile "data/previous-${PROFILE_FILE}"
                --previous-status data/previous-status.json
              )
              ;;
            confirmed_absent)
              ;;
            *)
              echo "Unsupported previous candidate state: ${previous_state}"
              exit 1
              ;;
          esac
          python -m scripts.candidate_snapshot prepare "${args[@]}"

      - name: Encrypt candidate V2 identity handoff
        if: env.ENABLE_CANDIDATE_V2 == 'true'
        env:
          CANDIDATE_HANDOFF_AES_KEY: ${{ secrets.CANDIDATE_HANDOFF_AES_KEY }}
        shell: bash
        run: |
          python -m scripts.candidate_handoff encrypt \
            --input candidate-private/identity-input.json \
            --output candidate-handoff/identity-input.enc \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --trigger-sha "${GITHUB_SHA}"

      - name: Upload legacy public staging
        uses: actions/upload-artifact@v4
        with:
          name: clash-verge-public-staging
          path: |
            legacy-public/README.md
            legacy-public/${{ env.PROFILE_FILE }}
            legacy-public/last-run.txt
            legacy-public/status.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload candidate identity handoff
        if: env.ENABLE_CANDIDATE_V2 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-identity-input
          path: candidate-handoff/identity-input.enc
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  candidate_identity:
    if: ${{ (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') == 'true' }}
    needs: collect
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted identity code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip3 install -r requirements.lock

      - name: Download encrypted identity handoff
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity-input
          path: candidate-handoff

      - name: Decrypt and authenticate candidate V2 identity handoff
        env:
          CANDIDATE_HANDOFF_AES_KEY: ${{ secrets.CANDIDATE_HANDOFF_AES_KEY }}
        run: |
          python -m scripts.candidate_handoff decrypt \
            --input candidate-handoff/identity-input.enc \
            --output candidate-private/identity-input.json \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --trigger-sha "${GITHUB_SHA}"

      - name: Build and validate candidate snapshot V2
        env:
          GMGN_IDENTITY_HMAC_KEY: ${{ secrets.GMGN_IDENTITY_HMAC_KEY }}
          GMGN_IDENTITY_KEY_VERSION: ${{ vars.GMGN_IDENTITY_KEY_VERSION }}
          GMGN_IDENTITY_EPOCH: ${{ vars.GMGN_IDENTITY_EPOCH }}
        run: |
          python -m scripts.candidate_snapshot build \
            --input candidate-private/identity-input.json \
            --output-dir candidate-public
          python -m scripts.public_bundle validate \
            --directory candidate-public \
            --kind candidate

      - name: Upload validated candidate public staging
        uses: actions/upload-artifact@v4
        with:
          name: candidate-public-staging
          path: |
            candidate-public/README.md
            candidate-public/${{ env.PROFILE_FILE }}
            candidate-public/last-run.txt
            candidate-public/status.json
            candidate-public/candidate-metadata.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1

  publish:
    if: >-
      ${{
        always() &&
        needs.collect.result == 'success' &&
        (
          (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') != 'true' ||
          needs.candidate_identity.result == 'success'
        )
      }}
    needs: [collect, candidate_identity]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout publish target
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download legacy public staging
        uses: actions/download-artifact@v4
        with:
          name: clash-verge-public-staging
          path: legacy-public

      - name: Download candidate V2 public staging
        if: ${{ (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-public-staging
          path: candidate-public

      - name: Select validated candidate public staging
        if: ${{ (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') == 'true' }}
        run: |
          # candidate-metadata.json belongs only to the V2 snapshot. When V2 is
          # explicitly disabled, the orphan rebuild intentionally restores the
          # exact legacy V1 file set instead of carrying a stale, unbound sidecar.
          # A failed V2 identity build never reaches this publish job, so the
          # existing V2 branch tip remains the last-good rollback point.
          python -m scripts.public_bundle validate \
            --directory candidate-public \
            --kind candidate
          python -m scripts.public_bundle copy \
            --source candidate-public \
            --destination public \
            --kind candidate

      - name: Select validated legacy public staging
        if: ${{ (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') != 'true' }}
        run: |
          python -m scripts.public_bundle copy \
            --source legacy-public \
            --destination public \
            --kind legacy

      - name: Validate exact public publication bundle
        shell: bash
        run: |
          if [ "${ENABLE_CANDIDATE_V2}" = "true" ]; then
            bundle_kind=candidate
          else
            bundle_kind=legacy
          fi
          python -m scripts.public_bundle validate \
            --directory public \
            --kind "${bundle_kind}"

      - name: Set up Python for candidate remote smoke
        if: ${{ (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install candidate remote smoke dependency
        if: ${{ (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') == 'true' }}
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Build and stage profile commit
        id: publication
        shell: bash
        env:
          OBSERVED_OUTPUT_TIP: ${{ needs.collect.outputs.observed_output_tip }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          output_ref="refs/heads/${OUTPUT_BRANCH}"
          previous_tip="${OBSERVED_OUTPUT_TIP}"
          if [ -n "${previous_tip}" ] && ! printf '%s\n' "${previous_tip}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Observed output tip is malformed." >&2
            exit 1
          fi

          set +e
          current_output="$(git ls-remote --heads origin "${output_ref}")"
          current_lookup_rc=$?
          set -e
          if [ "${current_lookup_rc}" -ne 0 ]; then
            echo "Unable to verify the current output branch tip." >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "${current_output}" | sed '/^$/d' | wc -l)" -gt 1 ]; then
            echo "Output branch lookup was ambiguous." >&2
            exit 1
          fi
          current_tip="$(printf '%s\n' "${current_output}" | awk 'NF {print $1}')"
          if [ "${current_tip}" != "${previous_tip}" ]; then
            echo "Output branch changed after collection; refusing to publish stale data." >&2
            exit 1
          fi

          publish_dir="$(mktemp -d)"
          git worktree add --detach "${publish_dir}"
          cd "${publish_dir}"
          git switch --orphan "${OUTPUT_BRANCH}"
          git reset
          cd "${GITHUB_WORKSPACE}"

          if [ "${ENABLE_CANDIDATE_V2}" = "true" ]; then
            bundle_kind=candidate
          else
            bundle_kind=legacy
          fi
          python -m scripts.public_bundle copy \
            --source public \
            --destination "${publish_dir}" \
            --kind "${bundle_kind}"

          cd "${publish_dir}"
          git add -- README.md "${PROFILE_FILE}" last-run.txt status.json
          if [ "${bundle_kind}" = "candidate" ]; then
            git add -- candidate-metadata.json
          fi
          git commit -m "Update Clash Verge profile" --allow-empty
          candidate_commit="$(git rev-parse HEAD)"

          if [ "${ENABLE_CANDIDATE_V2}" = "true" ]; then
            if [ -n "${previous_tip}" ]; then
              git fetch --no-tags --depth=1 origin "${output_ref}"
            fi
            staging_ref="refs/heads/${CANDIDATE_STAGING_BRANCH}"
            previous_staging="$(git ls-remote --heads origin "${staging_ref}")"
            if [ "$(printf '%s\n' "${previous_staging}" | sed '/^$/d' | wc -l)" -gt 1 ]; then
              echo "Candidate staging branch lookup was ambiguous." >&2
              exit 1
            fi
            staging_tip="$(printf '%s\n' "${previous_staging}" | awk 'NF {print $1}')"
            git push \
              --force-with-lease="${staging_ref}:${staging_tip}" \
              origin "${candidate_commit}:${staging_ref}"
          else
            git push \
              --force-with-lease="${output_ref}:${previous_tip}" \
              origin "${candidate_commit}:${output_ref}"
            staging_ref=""
          fi

          {
            echo "publish_dir=${publish_dir}"
            echo "candidate_commit=${candidate_commit}"
            echo "previous_tip=${previous_tip}"
            echo "output_ref=${output_ref}"
            echo "staging_ref=${staging_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Smoke exact candidate staging commit
        if: ${{ (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          revision="${{ steps.publication.outputs.candidate_commit }}"
          publish_dir="${{ steps.publication.outputs.publish_dir }}"
          raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${revision}"
          python -m scripts.validate_public_outputs candidate \
            --profile "${publish_dir}/${PROFILE_FILE}" \
            --status "${publish_dir}/status.json" \
            --metadata "${publish_dir}/candidate-metadata.json" \
            --profile-url "${raw_base}/${PROFILE_FILE}" \
            --status-url "${raw_base}/status.json" \
            --metadata-url "${raw_base}/candidate-metadata.json" \
            --expected-revision "${revision}" \
            --expected-main-sha "${GITHUB_SHA}" \
            --scope staging \
            --evidence-dir candidate-remote-smoke/staging

      - name: Lease-promote and smoke candidate output branch
        if: ${{ (github.event.inputs.candidate_v2 || vars.ENABLE_GITHUB_CANDIDATE_V2 || 'false') == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_commit="${{ steps.publication.outputs.candidate_commit }}"
          previous_tip="${{ steps.publication.outputs.previous_tip }}"
          output_ref="${{ steps.publication.outputs.output_ref }}"
          publish_dir="${{ steps.publication.outputs.publish_dir }}"

          rollback_candidate_output() {
            failure_rc="${1:-1}"
            if [ "${failure_rc}" -eq 0 ]; then
              failure_rc=1
            fi

            # The candidate commit is the only tip this run is allowed to
            # replace. If another writer changed the branch, the lease rejects
            # the rollback instead of overwriting that external update.
            set +e
            if [ -n "${previous_tip}" ]; then
              git push \
                --force-with-lease="${output_ref}:${candidate_commit}" \
                origin "${previous_tip}:${output_ref}"
            else
              git push \
                --force-with-lease="${output_ref}:${candidate_commit}" \
                origin ":${output_ref}"
            fi
            rollback_push_rc=$?
            set -e
            if [ "${rollback_push_rc}" -ne 0 ]; then
              echo "Candidate output rollback was rejected; the remote tip changed or the transport failed." >&2
              exit "${failure_rc}"
            fi

            set +e
            restored_output="$(git ls-remote --heads origin "${output_ref}")"
            restored_lookup_rc=$?
            set -e
            if [ "${restored_lookup_rc}" -ne 0 ]; then
              echo "Candidate output rollback tip could not be verified." >&2
              exit "${failure_rc}"
            fi
            if [ "$(printf '%s\n' "${restored_output}" | sed '/^$/d' | wc -l)" -gt 1 ]; then
              echo "Candidate output rollback tip lookup was ambiguous." >&2
              exit "${failure_rc}"
            fi
            restored_tip="$(printf '%s\n' "${restored_output}" | awk 'NF {print $1}')"
            if [ "${restored_tip}" != "${previous_tip}" ]; then
              echo "Candidate output rollback could not be verified." >&2
              exit "${failure_rc}"
            fi
            echo "Candidate publication verification failed; previous output was restored." >&2
            exit "${failure_rc}"
          }

          git push \
            --force-with-lease="${output_ref}:${previous_tip}" \
            origin "${candidate_commit}:${output_ref}"

          set +e
          actual_output="$(git ls-remote --heads origin "${output_ref}")"
          actual_lookup_rc=$?
          set -e
          if [ "${actual_lookup_rc}" -ne 0 ]; then
            echo "Candidate output tip could not be read after promotion." >&2
            rollback_candidate_output 1
          fi
          if [ "$(printf '%s\n' "${actual_output}" | sed '/^$/d' | wc -l)" -gt 1 ]; then
            echo "Candidate output tip lookup was ambiguous after promotion." >&2
            rollback_candidate_output 1
          fi
          actual_tip="$(printf '%s\n' "${actual_output}" | awk 'NF {print $1}')"
          if [ "${actual_tip}" != "${candidate_commit}" ]; then
            echo "Candidate output tip differs after promotion." >&2
            rollback_candidate_output 1
          fi

          raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}"
          set +e
          python -m scripts.validate_public_outputs candidate \
            --profile "${publish_dir}/${PROFILE_FILE}" \
            --status "${publish_dir}/status.json" \
            --metadata "${publish_dir}/candidate-metadata.json" \
            --profile-url "${raw_base}/${PROFILE_FILE}" \
            --status-url "${raw_base}/status.json" \
            --metadata-url "${raw_base}/candidate-metadata.json" \
            --expected-revision "${OUTPUT_BRANCH}" \
            --expected-main-sha "${GITHUB_SHA}" \
            --scope current \
            --evidence-dir candidate-remote-smoke/current
          smoke_rc=$?
          set -e
          if [ "${smoke_rc}" -ne 0 ]; then
            echo "Candidate current smoke failed." >&2
            rollback_candidate_output "${smoke_rc}"
          fi

      - name: Summary
        shell: bash
        run: |
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}/${PROFILE_FILE}"
          echo "### Clash Verge subscription" >> "${GITHUB_STEP_SUMMARY}"
          echo "${url}" >> "${GITHUB_STEP_SUMMARY}"
