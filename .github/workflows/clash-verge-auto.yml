name: Clash Verge Auto

on:
  schedule:
    # Refresh existing subscriptions at 06:17 / 12:17 / 18:17 UTC.
    - cron: "17 6-23/6 * * *"
    # Rebuild the source list daily at 00:17 UTC / 08:17 Asia-Shanghai.
    # Free airport trials usually expire within 1-3 days, so re-register every day.
    # NOTE: keep this cron string in sync with the check in the "Choose run mode" step.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto chooses refresh normally and collect on the daily 00:17 UTC run."
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - refresh
          - collect
      alive_check:
        description: "Run Clash liveness checks before publishing."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      full_fork_scan:
        description: "Scan every historical GitHub fork page (slow maintenance run)."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: clash-verge-auto
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  OUTPUT_BRANCH: clash-verge-output
  PROFILE_FILE: clash.yaml
  REQUESTED_MODE: ${{ github.event.inputs.mode || 'auto' }}
  REQUESTED_ALIVE_CHECK: ${{ github.event.inputs.alive_check || 'true' }}
  FULL_FORK_SCAN: ${{ github.event.inputs.full_fork_scan || 'false' }}
  FORK_SCAN_PAGES: ${{ vars.FORK_SCAN_PAGES || '2' }}
  SCHEDULE_NAME: ${{ github.event.schedule || '' }}
  GH_TOKEN: ${{ github.token }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS || 'true' }}
  # Rotate through the large airport pool instead of re-registering all ~2000
  # historical domains every day. Successful sites are always prioritized.
  AIRPORT_MAX_DOMAINS: ${{ vars.AIRPORT_MAX_DOMAINS || '192' }}
  AIRPORT_DISCOVERY_MAX_DOMAINS: ${{ vars.AIRPORT_DISCOVERY_MAX_DOMAINS || '256' }}
  # The final profile is never published unless every retained proxy passes all
  # required sites and the result remains above this safety floor.
  GMGN_CHECK_URL: ${{ vars.GMGN_CHECK_URL || 'https://gmgn.ai/' }}
  STRICT_MIN_NODES: ${{ vars.STRICT_MIN_NODES || '20' }}
  STRICT_MIN_RETAIN_RATIO: ${{ vars.STRICT_MIN_RETAIN_RATIO || '0.25' }}
  # Optional self-hosted mainland-China TCP probe (Aliyun FC). Without this
  # secret, GitHub skips the China-side prefilter and keeps the full candidate set.
  PROBE_URL: ${{ secrets.PROBE_URL }}
  PROBE_TOKEN: ${{ secrets.PROBE_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip3 install -r requirements.lock

      - name: Run pipeline unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore previous data
        run: |
          mkdir -p data
          git fetch origin "${OUTPUT_BRANCH}:refs/remotes/origin/${OUTPUT_BRANCH}" --depth=1 || true

          # crawler-subs.json / crawler-proxies.txt carry the crawler's accumulated
          # subscription pool across runs; without them every run starts cold.
          for name in subscribes.txt domains.txt valid-domains.txt crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json cn-fc-check.json; do
            if git show "origin/${OUTPUT_BRANCH}:${name}" > "/tmp/${name}" 2>/dev/null; then
              cp "/tmp/${name}" "data/${name}"
              echo "Restored ${name} from ${OUTPUT_BRANCH}."
            fi
          done

          if git show "origin/${OUTPUT_BRANCH}:status.json" > /tmp/previous-status.json 2>/dev/null; then
            cp /tmp/previous-status.json data/previous-status.json
            echo "Restored the previous publish status for strict-filter safeguards."
          fi

      - name: Build manual subscription config
        id: manual
        shell: bash
        env:
          CLASH_SUBSCRIPTIONS_SECRET: ${{ secrets.CLASH_SUBSCRIPTIONS }}
          CLASH_SUBSCRIPTION_URL_SECRET: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
        run: |
          python -m scripts.build_manual_config

          if [ -s subscribe/config/clash-verge.generated.json ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Choose run mode
        id: mode
        shell: bash
        run: |
          mode="${REQUESTED_MODE}"
          if [ "${mode}" = "auto" ]; then
            if [ "${SCHEDULE_NAME}" = "17 0 * * *" ]; then
              mode="collect"
            else
              mode="refresh"
            fi
          fi

          if [ "${{ steps.manual.outputs.enabled }}" = "true" ]; then
            mode="manual"
          elif [ ! -s data/subscribes.txt ]; then
            mode="collect"
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Selected mode: ${mode}"

      - name: Generate Clash profile from manual subscriptions
        if: steps.mode.outputs.mode == 'manual'
        shell: bash
        run: |
          mkdir -p data
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"

          if [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
            export SKIP_ALIVE_CHECK="false"
          else
            export SKIP_ALIVE_CHECK="true"
          fi

          python -u subscribe/process.py -s subscribe/config/clash-verge.generated.json --overwrite --invisible

          if [ ! -s "data/${PROFILE_FILE}" ]; then
            echo "Manual subscriptions did not produce data/${PROFILE_FILE}."
            exit 1
          fi

      - name: Generate Clash profile from collected sources
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"
          base_args=(--all --targets clash --num 64 --delay 10000 --easygoing --pages 3)
          fallback_args=(--all --targets clash --num 64 --delay 10000 --easygoing --skip --overwrite)

          if [ "${REQUESTED_ALIVE_CHECK}" != "true" ]; then
            base_args+=(--skip)
          fi

          run_mode="${{ steps.mode.outputs.mode }}"
          if [ "${run_mode}" = "refresh" ]; then
            base_args+=(--refresh)
          else
            base_args+=(--overwrite)
          fi

          set +e
          python -u subscribe/collect.py "${base_args[@]}"
          status=$?
          set -e

          if [ "${status}" -ne 0 ] || [ ! -s "data/${PROFILE_FILE}" ]; then
            if [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
              echo "Airport collection did not produce live nodes; continuing with crawler mode."
            else
              echo "Primary generation did not produce ${PROFILE_FILE}; trying a no-alive-check rebuild."
              set +e
              python -u subscribe/collect.py "${fallback_args[@]}"
              status=$?
              set -e
            fi
          fi

          if [ -s "data/${PROFILE_FILE}" ]; then
            cp "data/${PROFILE_FILE}" "data/collect-${PROFILE_FILE}"
          else
            echo "No airport collection profile available for merge."
          fi

      - name: Build crawler config
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          python -m scripts.build_crawler_config

      - name: Generate Clash profile from crawlers
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          export LOCAL_BASEDIR="${GITHUB_WORKSPACE}/data"

          if [ "${REQUESTED_ALIVE_CHECK}" = "true" ]; then
            export SKIP_ALIVE_CHECK="false"
          else
            export SKIP_ALIVE_CHECK="true"
          fi

          set +e
          python -u subscribe/process.py -s subscribe/config/clash-verge-crawler.generated.json --overwrite --flexible --invisible --timeout 10000 --num 128
          status=$?
          set -e

          if [ "${status}" -ne 0 ]; then
            echo "Crawler generation failed; keeping airport collection output."
          elif [ ! -s "data/crawler-clash.yaml" ]; then
            echo "Crawler generation produced no Clash profile; keeping airport collection output."
          fi

      - name: Merge collected and crawled profiles
        if: steps.mode.outputs.mode != 'manual'
        shell: bash
        run: |
          python -m scripts.merge_clash_profiles

      - name: Drop GFW-blocked entries via configured China-side probe
        if: env.PROBE_URL != ''
        shell: bash
        run: |
          python -m scripts.apply_tcp_probe

      - name: Filter proxies by required site reachability
        shell: bash
        run: |
          python -m scripts.filter_reachability

      - name: Prepare publish files
        shell: bash
        run: |
          mkdir -p public
          cp "data/${PROFILE_FILE}" "public/${PROFILE_FILE}"

          for name in subscribes.txt domains.txt valid-domains.txt collect-clash.yaml crawler-clash.yaml crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json crawler-v2rayse.txt crawler-v2rayse-modified.json cn-fc-check.json; do
            # Never publish manual subscription URLs: they may embed private tokens.
            if [ "${name}" = "subscribes.txt" ] && [ "${{ steps.mode.outputs.mode }}" = "manual" ]; then
              echo "Skip publishing subscribes.txt in manual mode."
              continue
            fi
            if [ -f "data/${name}" ]; then
              cp "data/${name}" "public/${name}"
            fi
          done

          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}/${PROFILE_FILE}"
          python -m scripts.prepare_github_publish \
            --profile "data/${PROFILE_FILE}" \
            --public-dir public \
            --profile-url "${url}" \
            --mode "${{ steps.mode.outputs.mode }}" \
            --alive-check "${REQUESTED_ALIVE_CHECK}" \
            --main-sha "${GITHUB_SHA}"

      - name: Publish profile branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the branch as a single orphan commit each run: the profile is
          # ~1MB per publish and an append-only history would grow the repo by
          # gigabytes per year. Raw URLs always resolve to the branch tip, so
          # consumers are unaffected by the force push.
          publish_dir="$(mktemp -d)"
          git worktree add --detach "${publish_dir}"
          cd "${publish_dir}"
          git switch --orphan "${OUTPUT_BRANCH}"
          git reset
          cd "${GITHUB_WORKSPACE}"

          cp public/README.md "${publish_dir}/README.md"
          cp "public/${PROFILE_FILE}" "${publish_dir}/${PROFILE_FILE}"
          cp public/last-run.txt "${publish_dir}/last-run.txt"
          cp public/status.json "${publish_dir}/status.json"

          for name in subscribes.txt domains.txt valid-domains.txt collect-clash.yaml crawler-clash.yaml crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json crawler-v2rayse.txt crawler-v2rayse-modified.json cn-fc-check.json; do
            if [ -f "public/${name}" ]; then
              cp "public/${name}" "${publish_dir}/${name}"
            fi
          done

          cd "${publish_dir}"
          git add README.md "${PROFILE_FILE}" last-run.txt status.json
          for name in subscribes.txt domains.txt valid-domains.txt collect-clash.yaml crawler-clash.yaml crawler-subs.json crawler-proxies.txt crawler-gitfork-subs.txt source-health.json domain-health.json crawler-v2rayse.txt crawler-v2rayse-modified.json cn-fc-check.json; do
            if [ -f "${name}" ]; then
              git add "${name}"
            fi
          done
          git commit -m "Update Clash Verge profile" --allow-empty
          git push --force origin "HEAD:${OUTPUT_BRANCH}"

      - name: Summary
        shell: bash
        run: |
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OUTPUT_BRANCH}/${PROFILE_FILE}"
          echo "### Clash Verge subscription" >> "${GITHUB_STEP_SUMMARY}"
          echo "${url}" >> "${GITHUB_STEP_SUMMARY}"
