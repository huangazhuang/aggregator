name: Sync GitHub main to CNB

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger_probe:
        description: Sync CNB main, then start the mainland-China probe
        required: false
        default: false
        type: boolean
      trigger_gmgn_shadow:
        description: Sync CNB main, then refresh GMGN shadow data and the priority profile
        required: false
        default: false
        type: boolean
      trigger_gmgn_v2_shadow:
        description: Sync CNB main, then start one guarded GMGN V2 shadow run
        required: false
        default: false
        type: boolean
      trigger_cnb_capability_probe:
        description: Sync CNB main, then inspect managed Docker isolation primitives without repository secrets
        required: false
        default: false
        type: boolean
      gmgn_v2_source_sha:
        description: Complete 64-character profile_sha256 from candidate status.json
        required: false
        default: ""
        type: string
      gmgn_v2_candidate_commit:
        description: Exact 40-character candidate output commit containing the bound public triple
        required: false
        default: ""
        type: string
      gmgn_v2_retry_token:
        description: Optional explicit infrastructure retry token (letters, digits, dot, underscore, hyphen)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sync-cnb-main
  # Queue mirror/trigger runs so a main push cannot cancel a manual run before
  # its CNB trigger tag is created.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CNB_REPO_URL: https://cnb.cool/ASD12321_446/aggregator.git
      GITHUB_REPO_URL: https://github.com/${{ github.repository }}.git
      CNB_TOKEN_USER_NAME: cnb
      CNB_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}

    steps:
      - name: Require main for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Checkout GitHub main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check mirror credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${CNB_TOKEN}" ]; then
            echo "::warning::CNB_MIRROR_TOKEN is not configured; skip the CNB mirror."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Fast-forward CNB main
        if: steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          main_sha="$(git rev-parse HEAD)"
          chmod +x scripts/cnb_git_askpass.sh
          remote_sha="$(
            GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
              GIT_TERMINAL_PROMPT=0 \
              git ls-remote "${CNB_REPO_URL}" refs/heads/main | awk '{print $1}'
          )"

          if [ "${remote_sha}" = "${main_sha}" ]; then
            echo "CNB main is already up to date: ${main_sha}"
            exit 0
          fi

          GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
            GIT_TERMINAL_PROMPT=0 \
            git push "${CNB_REPO_URL}" "HEAD:refs/heads/main"
          echo "CNB main fast-forwarded to ${main_sha}"

      - name: Trigger CNB mainland-China probe
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.trigger_probe &&
          steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          probe_tag="cnb-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag "${probe_tag}" HEAD
          GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
            GIT_TERMINAL_PROMPT=0 \
            git push "${CNB_REPO_URL}" "refs/tags/${probe_tag}:refs/tags/${probe_tag}"
          echo "CNB probe trigger tag pushed: ${probe_tag}"

      - name: Trigger CNB GMGN probe and priority profile
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.trigger_gmgn_shadow &&
          steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          shadow_tag="cnb-gmgn-shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag "${shadow_tag}" HEAD
          GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
            GIT_TERMINAL_PROMPT=0 \
            git push "${CNB_REPO_URL}" "refs/tags/${shadow_tag}:refs/tags/${shadow_tag}"
          echo "CNB GMGN probe trigger tag pushed: ${shadow_tag}"

      - name: Trigger secret-free CNB capability diagnostic
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.trigger_cnb_capability_probe &&
          steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          capability_tag="cnb-runner-capability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag "${capability_tag}" HEAD
          GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
            GIT_TERMINAL_PROMPT=0 \
            git push "${CNB_REPO_URL}" "refs/tags/${capability_tag}:refs/tags/${capability_tag}"
          echo "CNB capability diagnostic trigger tag pushed: ${capability_tag}"

      - name: Trigger guarded CNB GMGN V2 shadow
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.trigger_gmgn_v2_shadow &&
          steps.credentials.outputs.enabled == 'true'
        env:
          GMGN_V2_SOURCE_SHA: ${{ inputs.gmgn_v2_source_sha }}
          GMGN_V2_CANDIDATE_COMMIT: ${{ inputs.gmgn_v2_candidate_commit }}
          GMGN_V2_RETRY_TOKEN: ${{ inputs.gmgn_v2_retry_token }}
        shell: bash
        run: |
          source_sha="${GMGN_V2_SOURCE_SHA}"
          candidate_commit="${GMGN_V2_CANDIDATE_COMMIT}"
          retry_token="${GMGN_V2_RETRY_TOKEN}"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::gmgn_v2_source_sha must be the complete lowercase 64-character profile_sha256."
            exit 1
          fi
          if [[ ! "${candidate_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gmgn_v2_candidate_commit must be the exact lowercase 40-character candidate output commit."
            exit 1
          fi
          if [ -n "${retry_token}" ] && [[ ! "${retry_token}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::gmgn_v2_retry_token has an invalid format."
            exit 1
          fi

          verify_candidate_ref() {
            ref="$1"
            label="$2"
            set +e
            lookup="$(git ls-remote --refs --heads "${GITHUB_REPO_URL}" "${ref}")"
            lookup_rc=$?
            set -e
            if [ "${lookup_rc}" -ne 0 ]; then
              echo "::error::Unable to read the ${label}."
              exit "${lookup_rc}"
            fi
            if [ "$(printf '%s\n' "${lookup}" | sed '/^$/d' | wc -l)" -ne 1 ]; then
              echo "::error::The ${label} is absent or ambiguous."
              exit 1
            fi
            tip="$(printf '%s\n' "${lookup}" | awk 'NF {print $1}')"
            if [ "${tip}" != "${candidate_commit}" ]; then
              echo "::error::The ${label} does not bind the requested candidate commit."
              exit 1
            fi
          }
          verify_candidate_ref \
            "refs/heads/clash-verge-candidate-v2-${candidate_commit}" \
            "immutable candidate ref"
          verify_candidate_ref \
            "refs/heads/clash-verge-candidate-v2-source-${source_sha}" \
            "candidate source index"

          if [ -n "${retry_token}" ]; then
            primary_tag="cnb-gmgn-v2-${source_sha}-${candidate_commit}"
            legacy_primary_tag="cnb-gmgn-v2-${source_sha}"
            set +e
            primary="$(
              GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
                GIT_TERMINAL_PROMPT=0 \
                git ls-remote --refs --tags "${CNB_REPO_URL}" "refs/tags/${primary_tag}"
            )"
            primary_lookup_rc=$?
            legacy_primary="$(
              GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
                GIT_TERMINAL_PROMPT=0 \
                git ls-remote --refs --tags "${CNB_REPO_URL}" "refs/tags/${legacy_primary_tag}"
            )"
            legacy_primary_lookup_rc=$?
            set -e
            if [ "${primary_lookup_rc}" -ne 0 ] || [ "${legacy_primary_lookup_rc}" -ne 0 ]; then
              echo "::error::Unable to verify the primary GMGN V2 trigger for this retry."
              exit 1
            fi
            if [ -z "${primary}" ] && [ -z "${legacy_primary}" ]; then
              echo "::error::An infrastructure retry requires an existing primary GMGN V2 trigger."
              exit 1
            fi
            v2_tag="cnb-gmgn-v2-retry-${source_sha}-${candidate_commit}-${retry_token}"
          else
            v2_tag="cnb-gmgn-v2-${source_sha}-${candidate_commit}"
          fi
          set +e
          existing="$(
            GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
              GIT_TERMINAL_PROMPT=0 \
              git ls-remote --refs --tags "${CNB_REPO_URL}" "refs/tags/${v2_tag}"
          )"
          lookup_rc=$?
          set -e
          if [ "${lookup_rc}" -ne 0 ]; then
            echo "::error::Unable to determine whether the GMGN V2 trigger already exists."
            exit "${lookup_rc}"
          fi
          if [ -n "${existing}" ]; then
            echo "CNB GMGN V2 trigger already exists; no-op: ${v2_tag}"
            exit 0
          fi

          git tag "${v2_tag}" HEAD
          GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
            GIT_TERMINAL_PROMPT=0 \
            git push "${CNB_REPO_URL}" "refs/tags/${v2_tag}:refs/tags/${v2_tag}"
          echo "CNB GMGN V2 trigger tag pushed for source ${source_sha} at candidate commit ${candidate_commit}."
