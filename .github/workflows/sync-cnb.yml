name: Sync GitHub main to CNB

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger_probe:
        description: Sync CNB main, then start the mainland-China probe
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sync-cnb-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CNB_REPO_URL: https://cnb.cool/ASD12321_446/aggregator.git
      CNB_TOKEN_USER_NAME: cnb
      CNB_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}

    steps:
      - name: Checkout GitHub main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check mirror credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${CNB_TOKEN}" ]; then
            echo "::warning::CNB_MIRROR_TOKEN is not configured; skip the CNB mirror."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Fast-forward CNB main
        if: steps.credentials.outputs.enabled == 'true'
        shell: bash
        run: |
          chmod +x scripts/cnb_git_askpass.sh
          remote_sha="$(
            GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
              GIT_TERMINAL_PROMPT=0 \
              git ls-remote "${CNB_REPO_URL}" refs/heads/main | awk '{print $1}'
          )"

          if [ "${remote_sha}" = "${GITHUB_SHA}" ]; then
            echo "CNB main is already up to date: ${GITHUB_SHA}"
            exit 0
          fi

          GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
            GIT_TERMINAL_PROMPT=0 \
            git push "${CNB_REPO_URL}" "HEAD:refs/heads/main"
          echo "CNB main fast-forwarded to ${GITHUB_SHA}"

      - name: Trigger CNB mainland-China probe
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.trigger_probe &&
          steps.credentials.outputs.enabled == 'true'
        shell: bash
        env:
          CNB_BUILD_API: https://api.cnb.cool/ASD12321_446/aggregator/-/build/start
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps(
              {
                  "branch": "main",
                  "sha": os.environ["GITHUB_SHA"],
                  "event": "api_trigger_china_probe",
                  "sync": "false",
                  "title": "Mainland China Mihomo probe",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              os.environ["CNB_BUILD_API"],
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.cnb.api+json",
                  "Authorization": f"Bearer {os.environ['CNB_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "aggregator-github-sync/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if not result.get("success"):
              raise SystemExit(f"CNB rejected the probe trigger: {result.get('message', '')}")
          print(f"CNB probe build number: {result.get('sn', '')}")
          print(f"CNB probe build URL: {result.get('buildLogUrl', '')}")
          PY
