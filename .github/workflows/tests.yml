name: Pipeline Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check GMGN V2 validator entry points
        run: |
          python -m scripts.validate_public_outputs candidate --help
          python -m scripts.validate_public_outputs run --help
          python -m scripts.validate_public_outputs series --help
          python -m scripts.validate_public_outputs migration --help

  gmgn-v2-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build guarded GMGN V2 child image
        run: docker build --file Dockerfile.gmgn-v2 --tag aggregator-gmgn-v2:test .

      - name: Smoke-test trusted offline entry points
        run: |
          docker run --rm --network none aggregator-gmgn-v2:test \
            python -m scripts.cnb_gmgn_v2 --help
          docker run --rm --network none aggregator-gmgn-v2:test \
            python -m scripts.validate_public_outputs --help
