name: One-time Recover GMGN Identity Secret

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter sync-existing-gmgn-identity to run the one-time secret sync."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-time-sync-gmgn-identity-secret
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ inputs.confirmation == 'sync-existing-gmgn-identity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GMGN_IDENTITY_HMAC_KEY: ${{ secrets.GMGN_IDENTITY_HMAC_KEY }}
      GMGN_IDENTITY_KEY_VERSION: ${{ vars.GMGN_IDENTITY_KEY_VERSION }}
      GMGN_IDENTITY_EPOCH: ${{ vars.GMGN_IDENTITY_EPOCH }}
      EXPECTED_CANDIDATE_COMMIT: a47c50544f522571fae80ff48de30414b880906b
      RECOVERY_PUBLIC_KEY_SHA256: CC06A4632645DE2DD801AFCC43B4FA7965CFCA4C149175D2E5A854DA099AB6EB

    steps:
      - name: Checkout trusted identity code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the retained GitHub identity secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${GMGN_IDENTITY_HMAC_KEY}"
          test -n "${GMGN_IDENTITY_KEY_VERSION}"
          test -n "${GMGN_IDENTITY_EPOCH}"
          python - <<'PY'
          import json
          import os
          import secrets
          import urllib.request

          from scripts.proxy_identity import (
              IdentitySettings,
              compute_public_ids,
              load_identity_test_vector,
          )

          candidate_commit = os.environ["EXPECTED_CANDIDATE_COMMIT"]
          url = (
              "https://raw.githubusercontent.com/huangazhuang/aggregator/"
              f"{candidate_commit}/candidate-metadata.json"
              f"?nonce={secrets.token_hex(8)}"
          )
          request = urllib.request.Request(
              url,
              headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              metadata = json.loads(response.read().decode("utf-8"))

          settings = IdentitySettings.from_environment()
          if metadata.get("identity_key_version") != settings.identity_key_version:
              raise SystemExit("GitHub identity key version does not match the retained candidate")
          if metadata.get("identity_epoch") != settings.identity_epoch:
              raise SystemExit("GitHub identity epoch does not match the retained candidate")

          fixture = load_identity_test_vector("tests/fixtures/gmgn_identity_v1.json")
          actual = compute_public_ids(
              fixture["proxy"],
              key=settings.key,
              identity_key_version=settings.identity_key_version,
              identity_epoch=settings.identity_epoch,
              public_ip=fixture["public_ipv4"],
          )
          expected = metadata.get("identity_preflight")
          if not isinstance(expected, dict) or any(
              expected.get(name) != value for name, value in actual.items()
          ):
              raise SystemExit("GitHub identity secret does not match the retained candidate")
          print("Retained GitHub identity preflight verified.")
          PY

      - name: Encrypt the exact identity configuration for local recovery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          public_key="${GITHUB_WORKSPACE}/.github/gmgn-identity-recovery-public.pem"
          actual_public_key_sha256="$(sha256sum "${public_key}" | awk '{print toupper($1)}')"
          test "${actual_public_key_sha256}" = "${RECOVERY_PUBLIC_KEY_SHA256}"

          recovery_dir="${RUNNER_TEMP}/gmgn-identity-recovery"
          mkdir -p "${recovery_dir}"
          export RECOVERY_PLAINTEXT_FILE="${recovery_dir}/identity.json"
          export RECOVERY_CIPHERTEXT_FILE="${recovery_dir}/identity.json.rsa-oaep-sha256.bin"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "GMGN_IDENTITY_HMAC_KEY": os.environ["GMGN_IDENTITY_HMAC_KEY"],
              "GMGN_IDENTITY_KEY_VERSION": os.environ["GMGN_IDENTITY_KEY_VERSION"],
              "GMGN_IDENTITY_EPOCH": os.environ["GMGN_IDENTITY_EPOCH"],
          }
          if any(not value for value in payload.values()):
              raise SystemExit("identity recovery payload is incomplete")
          Path(os.environ["RECOVERY_PLAINTEXT_FILE"]).write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          test "$(wc -c < "${RECOVERY_PLAINTEXT_FILE}")" -le 300
          openssl pkeyutl -encrypt \
            -pubin \
            -inkey "${public_key}" \
            -in "${RECOVERY_PLAINTEXT_FILE}" \
            -out "${RECOVERY_CIPHERTEXT_FILE}" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256
          shred --remove "${RECOVERY_PLAINTEXT_FILE}"
          test -s "${RECOVERY_CIPHERTEXT_FILE}"
          echo "Identity configuration encrypted for the local recovery key."

      - name: Upload the encrypted local recovery payload
        uses: actions/upload-artifact@v4
        with:
          name: gmgn-identity-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/gmgn-identity-recovery/identity.json.rsa-oaep-sha256.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
