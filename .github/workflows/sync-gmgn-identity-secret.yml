name: One-time Sync GMGN Identity Secret to CNB

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter sync-existing-gmgn-identity to run the one-time secret sync."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-time-sync-gmgn-identity-secret
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ inputs.confirmation == 'sync-existing-gmgn-identity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CNB_SECRET_REPO_URL: https://cnb.cool/ASD12321_446/aggregator-gmgn-secrets.git
      CNB_TOKEN_USER_NAME: cnb
      CNB_TOKEN: ${{ secrets.CNB_SECRET_SYNC_TOKEN }}
      GMGN_IDENTITY_HMAC_KEY: ${{ secrets.GMGN_IDENTITY_HMAC_KEY }}
      GMGN_IDENTITY_KEY_VERSION: ${{ vars.GMGN_IDENTITY_KEY_VERSION }}
      GMGN_IDENTITY_EPOCH: ${{ vars.GMGN_IDENTITY_EPOCH }}
      EXPECTED_CANDIDATE_COMMIT: a47c50544f522571fae80ff48de30414b880906b

    steps:
      - name: Checkout trusted identity code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the retained GitHub identity secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${CNB_TOKEN}"
          test -n "${GMGN_IDENTITY_HMAC_KEY}"
          test -n "${GMGN_IDENTITY_KEY_VERSION}"
          test -n "${GMGN_IDENTITY_EPOCH}"
          python - <<'PY'
          import json
          import os
          import secrets
          import urllib.request

          from scripts.proxy_identity import (
              IdentitySettings,
              compute_public_ids,
              load_identity_test_vector,
          )

          candidate_commit = os.environ["EXPECTED_CANDIDATE_COMMIT"]
          url = (
              "https://raw.githubusercontent.com/huangazhuang/aggregator/"
              f"{candidate_commit}/candidate-metadata.json"
              f"?nonce={secrets.token_hex(8)}"
          )
          request = urllib.request.Request(
              url,
              headers={"Cache-Control": "no-cache", "Pragma": "no-cache"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              metadata = json.loads(response.read().decode("utf-8"))

          settings = IdentitySettings.from_environment()
          if metadata.get("identity_key_version") != settings.identity_key_version:
              raise SystemExit("GitHub identity key version does not match the retained candidate")
          if metadata.get("identity_epoch") != settings.identity_epoch:
              raise SystemExit("GitHub identity epoch does not match the retained candidate")

          fixture = load_identity_test_vector("tests/fixtures/gmgn_identity_v1.json")
          actual = compute_public_ids(
              fixture["proxy"],
              key=settings.key,
              identity_key_version=settings.identity_key_version,
              identity_epoch=settings.identity_epoch,
              public_ip=fixture["public_ipv4"],
          )
          expected = metadata.get("identity_preflight")
          if not isinstance(expected, dict) or any(
              expected.get(name) != value for name, value in actual.items()
          ):
              raise SystemExit("GitHub identity secret does not match the retained candidate")
          print("Retained GitHub identity preflight verified.")
          PY

      - name: Synchronize the exact identity configuration to the CNB secret repository
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          public_repo_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CNB_TOKEN}" \
            --header 'Accept: application/json' \
            https://api.cnb.cool/ASD12321_446/aggregator/-/git/head)"
          secret_repo_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CNB_TOKEN}" \
            --header 'Accept: application/json' \
            https://api.cnb.cool/ASD12321_446/aggregator-gmgn-secrets/-/git/head)"
          if [[ "${public_repo_status}" != "200" ]]; then
            echo "::error::CNB rejected repo-code access even for the public aggregator repository (API HTTP ${public_repo_status})."
            exit 1
          fi
          if [[ "${secret_repo_status}" != "200" ]]; then
            echo "::error::The token has repo-code access, but not to the private secret repository (API HTTP ${secret_repo_status})."
            exit 1
          fi
          echo "CNB token and private repository access verified through the API."

          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          chmod +x scripts/cnb_git_askpass.sh
          secret_dir="${RUNNER_TEMP}/cnb-gmgn-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
            GIT_TERMINAL_PROMPT=0 \
            git clone --depth=1 --branch main "${CNB_SECRET_REPO_URL}" "${secret_dir}"

          export CNB_SECRET_FILE="${secret_dir}/secret.yml"
          python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          names = (
              "GMGN_IDENTITY_HMAC_KEY",
              "GMGN_IDENTITY_KEY_VERSION",
              "GMGN_IDENTITY_EPOCH",
          )
          secret_path = Path(os.environ["CNB_SECRET_FILE"])
          try:
              payload = yaml.safe_load(secret_path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit("CNB secret.yml is not valid YAML") from None
          if not isinstance(payload, dict):
              raise SystemExit("CNB secret.yml must contain a mapping")
          updates = {name: os.environ[name] for name in names}
          if any(not value for value in updates.values()):
              raise SystemExit("identity configuration is incomplete")
          payload.update(updates)
          secret_path.write_text(
              yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          PY
          chmod 600 "${CNB_SECRET_FILE}"

          cd "${secret_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- secret.yml
          if git diff --cached --quiet; then
            echo "CNB GMGN identity configuration is already synchronized."
            exit 0
          fi
          git commit -m "Sync GMGN identity configuration"
          GIT_ASKPASS="${GITHUB_WORKSPACE}/scripts/cnb_git_askpass.sh" \
            GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:refs/heads/main
          echo "CNB GMGN identity configuration synchronized."
