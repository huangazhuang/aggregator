                run_token="$(printf '%s' "${CNB_BUILD_ID:-${main_sha}}-1" | sha256sum | cut -c1-12)"
                container="gmgn-v2-probe-1-${run_token}"
                cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
                trap cleanup EXIT
                docker create --name "${container}" \
                  --cap-add NET_ADMIN --cap-add SYS_ADMIN \
                  "${child_image}" \
                  python -m scripts.cnb_gmgn_v2 probe \
                    --manifest /work/input/manifest.json \
                    --shard-input /work/input/shard.json \
                    --shard-index 1 \
                    --controller-secret /work/input/controller-secret.txt \
                    --mihomo /opt/aggregator/clash/clash-linux-amd \
                    --output-dir /work/.cnb-runtime/shard-1
                if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${container}" \
                  | grep -Eq '^(CNB_TOKEN|GMGN_IDENTITY_HMAC_KEY)='; then exit 1; fi
                test "$(docker inspect --format '{{json .Mounts}}' "${container}")" = "[]"
                docker cp .cnb-runtime/gmgn-v2/prepared/manifest.json "${container}:/work/input/manifest.json"
                docker cp .cnb-runtime/gmgn-v2/prepared/shards/shard-1.json "${container}:/work/input/shard.json"
                docker cp .cnb-runtime/gmgn-v2/prepared/controller-secrets/shard-1.txt "${container}:/work/input/controller-secret.txt"
                set +e
                docker start --attach "${container}"
                probe_status="$?"
                set -e
                mkdir -p .cnb-runtime/gmgn-v2/shards/shard-1
                if test "${probe_status}" -ne 0; then
                  mkdir -p .cnb-runtime/gmgn-v2/shards/shard-1/safe-diagnostics
                  docker cp "${container}:/work/.cnb-runtime/shard-1/safe-diagnostics/." \
                    .cnb-runtime/gmgn-v2/shards/shard-1/safe-diagnostics/ || true
                  exit "${probe_status}"
                fi
                docker cp "${container}:/work/.cnb-runtime/shard-1/." .cnb-runtime/gmgn-v2/shards/shard-1/
            shard-2:
              timeout: 300m
              script: |
                set -eu
                umask 077
                if test -f .cnb-runtime/gmgn-v2/admission-noop || test -f .cnb-runtime/gmgn-v2/noop; then exit 0; fi
