main:
  "crontab: 0 10,22 * * *":
    - &github_main_sync
      name: Sync GitHub main to CNB
      runner:
        tags: cnb:arch:amd64
        cpus: 1
      docker:
        image: python:3.12-bookworm
      env:
        GITHUB_MAIN_REPO: https://github.com/huangazhuang/aggregator.git
      stages:
        - name: Fast-forward CNB main from GitHub
          timeout: 10m
          script: |
            set -eu
            test -n "${CNB_TOKEN:-}"
            test -n "${CNB_REPO_SLUG:-}"

            git fetch --no-tags "${GITHUB_MAIN_REPO}" main
            github_sha="$(git rev-parse FETCH_HEAD)"
            cnb_sha="$(git rev-parse HEAD)"
            if [ "${github_sha}" = "${cnb_sha}" ]; then
              printf 'CNB main is already up to date: %s\n' "${github_sha}"
              exit 0
            fi

            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git push "${web_endpoint}/${CNB_REPO_SLUG}.git" "FETCH_HEAD:refs/heads/main"
            printf 'CNB main fast-forwarded: %s -> %s\n' "${cnb_sha}" "${github_sha}"

  # Run after the corresponding GitHub source-profile refresh has had time to
  # publish. Keep the main-mirror schedule above unchanged: this probe reads
  # the generated clash-verge-output branch directly from GitHub.
  "crontab: 10 11,23 * * *":
    - &china_probe
      name: Mainland China Mihomo probe
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12-bookworm
      # Prevent a scheduled probe and a manual/web-triggered probe from
      # running at the same time and force-pushing the same output branch.
      # The 2-hour lease/wait window is longer than the current ~30-40-minute
      # full scan and leaves room for publishing diagnostics.
      lock:
        key: aggregator-mainland-probe
        expires: 7200
        wait: true
        timeout: 7200
        cancel-in-progress: false
      env:
        SOURCE_PROFILE_URL: https://raw.githubusercontent.com/huangazhuang/aggregator/clash-verge-output/clash.yaml
        SOURCE_STATUS_URL: https://raw.githubusercontent.com/huangazhuang/aggregator/clash-verge-output/status.json
        SOURCE_MAX_AGE_SECONDS: "18000"
        SOURCE_FRESHNESS_WAIT_SECONDS: "1200"
        SOURCE_FRESHNESS_POLL_SECONDS: "60"
        TARGET_URL: https://www.gstatic.com/generate_204
        EXPECTED_STATUS: "204"
        OUTPUT_BRANCH: clash-cn-output
        DIAGNOSTICS_BRANCH: clash-cn-diagnostics
        PRELIMINARY_ROUNDS: "3"
        TOTAL_ROUNDS: "20"
        ROUND_GAP_SECONDS: "0.75"
        BASE_TARGET: "80"
        MAX_NODES: "150"
        NON_ASIA_MIN: "10"
        NON_ASIA_MAX: "20"
        MIN_SUCCESS_RATE: "0.70"
        BASE_PREFERRED_SUCCESS_RATE: "0.80"
        ELITE_MIN_SUCCESS_RATE: "0.90"
        MAX_QUALIFIED_P90_MS: "2800"
        ELITE_MAX_P90_MS: "2000"
        ASIA_FALLBACK_MIN_SUCCESS: "12"
        ASIA_EMERGENCY_MIN_SUCCESS: "10"
        ASIA_EMERGENCY_MAX_P90_MS: "2800"
        ASIA_EMERGENCY_MAX_COUNT: "0"
        # 80 is a soft capacity target.  Keep only quality-qualified nodes;
        # allow a smaller valid publication, while retaining 40% of the last
        # good profile to fail closed on partial/infrastructure scans.
        MIN_SUCCESS: "1"
        MIN_RETAIN_RATIO: "0.40"
        TIMEOUT_MS: "3000"
      stages:
        - name: Test proxies from the CNB runner
          timeout: 80m
          script: |
            set -eu
            python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.2
            chmod +x clash/clash-linux-amd
            mkdir -p .cnb-runtime public-cn
            test -n "${CNB_REPO_SLUG:-}"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            previous_status_url="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${OUTPUT_BRANCH}/status.json"
            main_sha="$(git rev-parse HEAD)"
            source_profile_snapshot=".cnb-runtime/source-clash.yaml"
            source_status_snapshot=".cnb-runtime/source-status.json"
            freshness_deadline="$(( $(date +%s) + SOURCE_FRESHNESS_WAIT_SECONDS ))"
            while :; do
              if python3 - \
                "${SOURCE_STATUS_URL}" \
                "${SOURCE_PROFILE_URL}" \
                "${SOURCE_MAX_AGE_SECONDS}" \
                "${source_status_snapshot}" \
                "${source_profile_snapshot}" <<'PY'
            import hashlib
            import json
            import sys
            import time
            import urllib.request
            from datetime import datetime, timezone
            from pathlib import Path

            status_url = sys.argv[1]
            profile_url = sys.argv[2]
            maximum_age = int(sys.argv[3])
            status_destination = Path(sys.argv[4])
            profile_destination = Path(sys.argv[5])
            cache_key = str(time.time_ns())

            def fetch(url: str) -> bytes:
                separator = "&" if "?" in url else "?"
                request = urllib.request.Request(
                    f"{url}{separator}cnb_snapshot={cache_key}",
                    headers={
                        "Cache-Control": "no-cache",
                        "Pragma": "no-cache",
                        "User-Agent": "aggregator-cnb-probe/1.0",
                    },
                )
                with urllib.request.urlopen(request, timeout=30) as response:
                    return response.read()

            def write_atomic(destination: Path, content: bytes) -> None:
                temporary = destination.with_suffix(destination.suffix + ".tmp")
                temporary.write_bytes(content)
                temporary.replace(destination)

            try:
                status_content = fetch(status_url)
                payload = json.loads(status_content.decode("utf-8"))
                run_at = str(payload.get("run_at") or "")
                profile_sha256 = str(payload.get("profile_sha256") or "").lower()
                generated_at = datetime.fromisoformat(run_at.replace("Z", "+00:00"))
                if generated_at.tzinfo is None:
                    generated_at = generated_at.replace(tzinfo=timezone.utc)
                age_seconds = (datetime.now(timezone.utc) - generated_at).total_seconds()
                if len(profile_sha256) != 64 or any(
                    character not in "0123456789abcdef" for character in profile_sha256
                ):
                    raise ValueError("profile_sha256 is missing or malformed")
                if not -300 <= age_seconds <= maximum_age:
                    raise ValueError(
                        f"source profile age {int(age_seconds)}s is outside the accepted window"
                    )
                profile_content = fetch(profile_url)
                actual_sha256 = hashlib.sha256(profile_content).hexdigest()
                if actual_sha256 != profile_sha256:
                    raise ValueError(
                        "source profile SHA-256 does not match the fresh status metadata"
                    )
                write_atomic(status_destination, status_content)
                write_atomic(profile_destination, profile_content)
                print(
                    f"Pinned GitHub source snapshot: run_at={run_at}, "
                    f"age={int(age_seconds)}s, sha256={profile_sha256[:12]}...",
                    flush=True,
                )
                raise SystemExit(0)
            except Exception as exc:
                print(f"GitHub source snapshot check failed: {exc}", file=sys.stderr, flush=True)
                raise SystemExit(1)
            PY
              then
                break
              fi
              if [ "$(date +%s)" -ge "${freshness_deadline}" ]; then
                printf '%s\n' 'ERROR: GitHub source profile did not become fresh before the wait deadline.' >&2
                exit 1
              fi
              printf 'Waiting %s seconds for a fresh GitHub source profile.\n' \
                "${SOURCE_FRESHNESS_POLL_SECONDS}"
              sleep "${SOURCE_FRESHNESS_POLL_SECONDS}"
            done
            set +e
            python3 -m scripts.cnb_mihomo_filter \
              --source "${source_profile_snapshot}" \
              --source-status "${source_status_snapshot}" \
              --previous-status "${previous_status_url}" \
              --main-sha "${main_sha}" \
              --mihomo clash/clash-linux-amd \
              --work-dir .cnb-runtime \
              --output-dir public-cn \
              --target-url "${TARGET_URL}" \
              --expected-status "${EXPECTED_STATUS}" \
              --timeout-ms "${TIMEOUT_MS}" \
              --preliminary-rounds "${PRELIMINARY_ROUNDS}" \
              --total-rounds "${TOTAL_ROUNDS}" \
              --round-gap "${ROUND_GAP_SECONDS}" \
              --workers 48 \
              --base-target "${BASE_TARGET}" \
              --max-nodes "${MAX_NODES}" \
              --non-asia-min "${NON_ASIA_MIN}" \
              --non-asia-max "${NON_ASIA_MAX}" \
              --min-success-rate "${MIN_SUCCESS_RATE}" \
              --base-preferred-success-rate "${BASE_PREFERRED_SUCCESS_RATE}" \
              --elite-min-success-rate "${ELITE_MIN_SUCCESS_RATE}" \
              --max-qualified-p90-ms "${MAX_QUALIFIED_P90_MS}" \
              --elite-max-p90-ms "${ELITE_MAX_P90_MS}" \
              --asia-fallback-min-success "${ASIA_FALLBACK_MIN_SUCCESS}" \
              --asia-emergency-min-success "${ASIA_EMERGENCY_MIN_SUCCESS}" \
              --asia-emergency-max-p90-ms "${ASIA_EMERGENCY_MAX_P90_MS}" \
              --asia-emergency-max-count "${ASIA_EMERGENCY_MAX_COUNT}" \
              --min-success "${MIN_SUCCESS}" \
              --min-retain-ratio "${MIN_RETAIN_RATIO}"
            probe_rc=$?
            set -e
            if test -f public-cn/failure.json; then
              printf '%s\n' '--- redacted failure.json ---'
              python3 -m json.tool public-cn/failure.json
            fi
            exit "${probe_rc}"

        - name: Publish the filtered profile to CNB
          timeout: 5m
          script: |
            set -eu
            test -n "${CNB_TOKEN:-}"
            test -n "${CNB_REPO_SLUG:-}"

            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            profile_url="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${OUTPUT_BRANCH}/clash.yaml"
            python3 -m scripts.prepare_cnb_publish \
              --output-dir public-cn \
              --profile-url "${profile_url}"

            mkdir -p .cnb-runtime/publish
            cp public-cn/clash.yaml .cnb-runtime/publish/clash.yaml
            cp public-cn/status.json .cnb-runtime/publish/status.json
            cp public-cn/probe-results.json .cnb-runtime/publish/probe-results.json
            cp public-cn/README.md .cnb-runtime/publish/README.md

            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            cd .cnb-runtime/publish
            git init
            git checkout -b "${OUTPUT_BRANCH}"
            git config user.name "cnb-probe[bot]"
            git config user.email "cnb-probe@users.noreply.cnb.cool"
            git add README.md clash.yaml status.json probe-results.json
            git commit -m "Update mainland-China tested Clash profile"

            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git push --force "${web_endpoint}/${CNB_REPO_SLUG}.git" "HEAD:${OUTPUT_BRANCH}"
            printf 'Subscription URL: %s\n' "${profile_url}"

      failStages:
        - name: Publish redacted CNB failure diagnostics
          timeout: 5m
          script: |
            set -eu
            if ! test -s public-cn/failure.json && ! test -s public-cn/redacted-probe-results.json; then
              printf '%s\n' 'No redacted failure diagnostics were produced; keeping the original failure status.'
              exit 0
            fi
            if ! test -n "${CNB_TOKEN:-}" || ! test -n "${CNB_REPO_SLUG:-}"; then
              printf '%s\n' 'CNB credentials are unavailable; failure diagnostics remain in the build log.'
              exit 0
            fi
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            mkdir -p .cnb-runtime/diagnostics
            published_failure=false
            published_replay=false
            if test -s public-cn/failure.json; then
              cp public-cn/failure.json .cnb-runtime/diagnostics/failure.json
              published_failure=true
            fi
            if test -s public-cn/redacted-probe-results.json; then
              cp public-cn/redacted-probe-results.json .cnb-runtime/diagnostics/redacted-probe-results.json
              published_replay=true
            fi
            cd .cnb-runtime/diagnostics
            git init
            git checkout -b "${DIAGNOSTICS_BRANCH}"
            git config user.name "cnb-probe[bot]"
            git config user.email "cnb-probe@users.noreply.cnb.cool"
            if [ "${published_failure}" = true ]; then
              git add failure.json
            fi
            if [ "${published_replay}" = true ]; then
              git add redacted-probe-results.json
            fi
            git commit -m "Record redacted mainland-China probe failure" >/dev/null
            set +e
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git push --force "${web_endpoint}/${CNB_REPO_SLUG}.git" "HEAD:${DIAGNOSTICS_BRANCH}"
            push_rc=$?
            set -e
            if [ "${push_rc}" -ne 0 ]; then
              printf 'WARNING: failure diagnostics push failed with code %s; original failure is preserved.\n' "${push_rc}"
            else
              if [ "${published_failure}" = true ]; then
                printf 'Failure diagnostics URL: %s\n' \
                  "${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${DIAGNOSTICS_BRANCH}/failure.json"
              fi
              if [ "${published_replay}" = true ]; then
                printf 'Redacted replay data URL: %s\n' \
                  "${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${DIAGNOSTICS_BRANCH}/redacted-probe-results.json"
              fi
            fi

  web_trigger_gmgn_shadow:
    - &gmgn_shadow
      name: Mainland China GMGN probe and priority profile
      runner:
        tags: cnb:arch:amd64
        cpus: 4
      docker:
        image: python:3.12-bookworm
      lock:
        key: aggregator-gmgn-shadow
        expires: 10800
        wait: true
        timeout: 10800
        cancel-in-progress: false
      env:
        SOURCE_PROFILE_URL: https://raw.githubusercontent.com/huangazhuang/aggregator/clash-verge-output/clash.yaml
        SOURCE_STATUS_URL: https://raw.githubusercontent.com/huangazhuang/aggregator/clash-verge-output/status.json
        # GitHub refreshes roughly every 6 hours and a collection run may take
        # several hours. Ten hours rejects genuinely stale output without
        # creating a guaranteed dead window before the next refresh finishes.
        SOURCE_MAX_AGE_SECONDS: "36000"
        SOURCE_FRESHNESS_WAIT_SECONDS: "1200"
        SOURCE_FRESHNESS_POLL_SECONDS: "60"
        SHADOW_BRANCH: clash-cn-gmgn-shadow
        GMGN_OUTPUT_BRANCH: clash-cn-gmgn-output
        SHADOW_TARGET_URL: https://gmgn.ai/
        SHADOW_EXPECTED_STATUS: "200"
        SHADOW_REQUEST_TIMEOUT_MS: "3000"
        SHADOW_QUALIFIED_DELAY_MS: "1000"
        SHADOW_TOTAL_ROUNDS: "20"
        SHADOW_ROUND_GAP_SECONDS: "0.75"
        SHADOW_WORKERS_PER_SHARD: "16"
        # Abort before launching four 120-minute jobs if the current source is
        # too large for this single-runner layout in an all-timeout scenario.
        SHADOW_MAX_ESTIMATED_SECONDS: "6600"
      stages:
        - name: Prepare the pinned GMGN shadow snapshot
          timeout: 30m
          script: |
            set -eu
            python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.2
            chmod +x clash/clash-linux-amd
            umask 077
            mkdir -p \
              .cnb-runtime/gmgn-shadow/selection \
              public-cn-shadow/fragments \
              public-cn-shadow/final \
              public-cn-gmgn
            main_sha="$(git rev-parse HEAD)"
            python3 -m scripts.cnb_gmgn_shadow prepare \
              --source "${SOURCE_PROFILE_URL}" \
              --source-status "${SOURCE_STATUS_URL}" \
              --source-max-age-seconds "${SOURCE_MAX_AGE_SECONDS}" \
              --source-freshness-wait-seconds "${SOURCE_FRESHNESS_WAIT_SECONDS}" \
              --source-freshness-poll-seconds "${SOURCE_FRESHNESS_POLL_SECONDS}" \
              --main-sha "${main_sha}" \
              --output-dir .cnb-runtime/gmgn-shadow/prepared \
              --target-url "${SHADOW_TARGET_URL}" \
              --expected-status "${SHADOW_EXPECTED_STATUS}" \
              --request-timeout-ms "${SHADOW_REQUEST_TIMEOUT_MS}" \
              --qualified-delay-ms "${SHADOW_QUALIFIED_DELAY_MS}" \
              --total-rounds "${SHADOW_TOTAL_ROUNDS}" \
              --round-gap "${SHADOW_ROUND_GAP_SECONDS}" \
              --shard-count 4 \
              --workers-per-shard "${SHADOW_WORKERS_PER_SHARD}" \
              --max-estimated-probe-seconds "${SHADOW_MAX_ESTIMATED_SECONDS}"

        - name: Probe four GMGN shards in parallel
          jobs:
            shard-0:
              timeout: 120m
              script: |
                set -eu
                umask 077
                python3 -m scripts.cnb_gmgn_shadow probe \
                  --manifest .cnb-runtime/gmgn-shadow/prepared/manifest.json \
                  --shard-index 0 \
                  --mihomo clash/clash-linux-amd \
                  --work-dir .cnb-runtime/gmgn-shadow/run-0 \
                  --output public-cn-shadow/fragments/shard-0.json \
                  --selection-output .cnb-runtime/gmgn-shadow/selection/shard-0.json \
                  --private-output-root .cnb-runtime/gmgn-shadow/selection \
                  --controller-port 19090 \
                  --mixed-port 17890
            shard-1:
              timeout: 120m
              script: |
                set -eu
                umask 077
                python3 -m scripts.cnb_gmgn_shadow probe \
                  --manifest .cnb-runtime/gmgn-shadow/prepared/manifest.json \
                  --shard-index 1 \
                  --mihomo clash/clash-linux-amd \
                  --work-dir .cnb-runtime/gmgn-shadow/run-1 \
                  --output public-cn-shadow/fragments/shard-1.json \
                  --selection-output .cnb-runtime/gmgn-shadow/selection/shard-1.json \
                  --private-output-root .cnb-runtime/gmgn-shadow/selection \
                  --controller-port 19091 \
                  --mixed-port 17891
            shard-2:
              timeout: 120m
              script: |
                set -eu
                umask 077
                python3 -m scripts.cnb_gmgn_shadow probe \
                  --manifest .cnb-runtime/gmgn-shadow/prepared/manifest.json \
                  --shard-index 2 \
                  --mihomo clash/clash-linux-amd \
                  --work-dir .cnb-runtime/gmgn-shadow/run-2 \
                  --output public-cn-shadow/fragments/shard-2.json \
                  --selection-output .cnb-runtime/gmgn-shadow/selection/shard-2.json \
                  --private-output-root .cnb-runtime/gmgn-shadow/selection \
                  --controller-port 19092 \
                  --mixed-port 17892
            shard-3:
              timeout: 120m
              script: |
                set -eu
                umask 077
                python3 -m scripts.cnb_gmgn_shadow probe \
                  --manifest .cnb-runtime/gmgn-shadow/prepared/manifest.json \
                  --shard-index 3 \
                  --mihomo clash/clash-linux-amd \
                  --work-dir .cnb-runtime/gmgn-shadow/run-3 \
                  --output public-cn-shadow/fragments/shard-3.json \
                  --selection-output .cnb-runtime/gmgn-shadow/selection/shard-3.json \
                  --private-output-root .cnb-runtime/gmgn-shadow/selection \
                  --controller-port 19093 \
                  --mixed-port 17893

        - name: Merge complete redacted GMGN results
          timeout: 5m
          script: |
            set -eu
            test -n "${CNB_REPO_SLUG:-}"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            results_url="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${SHADOW_BRANCH}/gmgn-shadow-results.json"
            python3 -m scripts.cnb_gmgn_shadow merge \
              --manifest .cnb-runtime/gmgn-shadow/prepared/manifest.json \
              --fragments \
                public-cn-shadow/fragments/shard-0.json \
                public-cn-shadow/fragments/shard-1.json \
                public-cn-shadow/fragments/shard-2.json \
                public-cn-shadow/fragments/shard-3.json \
              --output-dir public-cn-shadow/final \
              --results-url "${results_url}"
            python3 -m json.tool public-cn-shadow/final/status.json

        - name: Publish the isolated GMGN shadow report
          timeout: 5m
          script: |
            set -eu
            test -n "${CNB_TOKEN:-}"
            test -n "${CNB_REPO_SLUG:-}"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            mkdir -p .cnb-runtime/gmgn-shadow/publish
            cp public-cn-shadow/final/README.md .cnb-runtime/gmgn-shadow/publish/README.md
            cp public-cn-shadow/final/status.json .cnb-runtime/gmgn-shadow/publish/status.json
            cp public-cn-shadow/final/gmgn-shadow-results.json \
              .cnb-runtime/gmgn-shadow/publish/gmgn-shadow-results.json
            cd .cnb-runtime/gmgn-shadow/publish
            git init
            git checkout -b "${SHADOW_BRANCH}"
            git config user.name "cnb-probe[bot]"
            git config user.email "cnb-probe@users.noreply.cnb.cool"
            git add README.md status.json gmgn-shadow-results.json
            git commit -m "Record redacted GMGN shadow probe"
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git push --force "${web_endpoint}/${CNB_REPO_SLUG}.git" "HEAD:${SHADOW_BRANCH}"
            printf 'GMGN shadow report: %s\n' \
              "${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${SHADOW_BRANCH}/status.json"

        - name: Build the independent GMGN priority profile
          timeout: 5m
          script: |
            set -eu
            test -n "${CNB_TOKEN:-}"
            test -n "${CNB_REPO_SLUG:-}"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            remote_url="${web_endpoint}/${CNB_REPO_SLUG}.git"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            previous_branch_ref="refs/heads/${GMGN_OUTPUT_BRANCH}"
            previous_branch_result=".cnb-runtime/gmgn-shadow/previous-gmgn-branch.txt"
            if GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git ls-remote --exit-code "${remote_url}" "${previous_branch_ref}" \
                > "${previous_branch_result}"; then
              previous_publication_exists=true
            else
              branch_check_status=$?
              if [ "${branch_check_status}" -eq 2 ]; then
                previous_publication_exists=false
              else
                printf 'Cannot determine whether %s exists (git ls-remote exit %s).\n' \
                  "${previous_branch_ref}" "${branch_check_status}" >&2
                exit "${branch_check_status}"
              fi
            fi
            profile_url="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${GMGN_OUTPUT_BRANCH}/clash.yaml"
            previous_cache_key="$(date +%s)"
            previous_profile_url="${profile_url}?cnb_previous=${previous_cache_key}"
            previous_status_url="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${GMGN_OUTPUT_BRANCH}/status.json?cnb_previous=${previous_cache_key}"
            python3 -m scripts.cnb_gmgn_publish \
              --manifest .cnb-runtime/gmgn-shadow/prepared/manifest.json \
              --fragments \
                .cnb-runtime/gmgn-shadow/selection/shard-0.json \
                .cnb-runtime/gmgn-shadow/selection/shard-1.json \
                .cnb-runtime/gmgn-shadow/selection/shard-2.json \
                .cnb-runtime/gmgn-shadow/selection/shard-3.json \
              --output-dir public-cn-gmgn \
              --previous-profile "${previous_profile_url}" \
              --previous-status "${previous_status_url}" \
              --previous-publication-exists "${previous_publication_exists}" \
              --profile-url "${profile_url}"
            python3 -m json.tool public-cn-gmgn/status.json
            mkdir -p .cnb-runtime/gmgn-shadow/final-check
            if ! env -i \
              PATH="${PATH}" \
              HOME="$(pwd)/.cnb-runtime/gmgn-shadow/final-check" \
              TMPDIR="$(pwd)/.cnb-runtime/gmgn-shadow/final-check" \
              clash/clash-linux-amd -t \
                -d .cnb-runtime/gmgn-shadow/final-check \
                -f public-cn-gmgn/clash.yaml \
                >.cnb-runtime/gmgn-shadow/final-check/mihomo-check.log 2>&1; then
              printf '%s\n' 'ERROR: Mihomo rejected the GMGN profile.' >&2
              exit 1
            fi

        - name: Publish the independent GMGN priority profile
          timeout: 5m
          script: |
            set -eu
            test -n "${CNB_TOKEN:-}"
            test -n "${CNB_REPO_SLUG:-}"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            profile_url="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${GMGN_OUTPUT_BRANCH}/clash.yaml"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            mkdir -p .cnb-runtime/gmgn-publish
            cp public-cn-gmgn/README.md .cnb-runtime/gmgn-publish/README.md
            cp public-cn-gmgn/status.json .cnb-runtime/gmgn-publish/status.json
            cp public-cn-gmgn/clash.yaml .cnb-runtime/gmgn-publish/clash.yaml
            cd .cnb-runtime/gmgn-publish
            git init
            git checkout -b "${GMGN_OUTPUT_BRANCH}"
            git config user.name "cnb-probe[bot]"
            git config user.email "cnb-probe@users.noreply.cnb.cool"
            git add README.md status.json clash.yaml
            git commit -m "Update GMGN-prioritized Clash profile"
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git push --force "${web_endpoint}/${CNB_REPO_SLUG}.git" "HEAD:${GMGN_OUTPUT_BRANCH}"
            printf 'GMGN priority subscription: %s\n' "${profile_url}"

  web_trigger_gmgn_v2_shadow:
    - &gmgn_v2_shadow
      name: Manual GMGN V2 guarded shadow publication
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      docker:
        image: python:3.12-bookworm
      services: [docker]
      lock:
        key: aggregator-gmgn-v2-shadow
        expires: 28800
        wait: true
        timeout: 28800
        cancel-in-progress: false
      env:
        V2_SOURCE_RAW_BASE: https://raw.githubusercontent.com/huangazhuang/aggregator
        V2_OUTPUT_BRANCH: clash-cn-gmgn-v2-shadow
        V2_CHILD_IMAGE: aggregator-gmgn-v2-child
        V2_WORKERS_PER_SHARD: "16"
        # Diagnostic shakedown: measure only N candidates so a calibration run
        # finishes in minutes instead of hours.  "0" means measure everything.
        # A run with a non-zero value never publishes and never counts as one
        # of the three valid rollout runs.
        V2_MAX_CANDIDATES: "400"
        V2_DOCKER_CLI_VERSION: "27.5.1"
        V2_DOCKER_CLI_SHA256: 4f798b3ee1e0140eab5bf30b0edc4e84f4cdb53255a429dc3bbae9524845d640
        V2_DOCKER_CLI_DIR: .cnb-runtime/gmgn-v2/docker-cli
        PATH: .cnb-runtime/gmgn-v2/docker-cli:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      stages:
        - name: Admit a capable managed runner before consuming the V2 trigger
          timeout: 20m
          script: |
            set -eu
            umask 077
            mkdir -p .cnb-runtime/gmgn-v2 "${V2_DOCKER_CLI_DIR}"
            printf '%s\n' admission > .cnb-runtime/gmgn-v2/current-stage.txt
            docker_archive=".cnb-runtime/gmgn-v2/docker-${V2_DOCKER_CLI_VERSION}.tgz"
            python3 - "${V2_DOCKER_CLI_VERSION}" "${docker_archive}" <<'PY'
            import pathlib
            import sys
            import urllib.request

            version, destination = sys.argv[1:]
            url = f"https://download.docker.com/linux/static/stable/x86_64/docker-{version}.tgz"
            pathlib.Path(destination).write_bytes(urllib.request.urlopen(url, timeout=120).read())
            PY
            printf '%s  %s\n' "${V2_DOCKER_CLI_SHA256}" "${docker_archive}" | sha256sum -c -
            tar -xzf "${docker_archive}" --strip-components=1 \
              -C "${V2_DOCKER_CLI_DIR}" docker/docker
            chmod 0755 "${V2_DOCKER_CLI_DIR}/docker"
            command -v docker >/dev/null
            test "$(docker version --format '{{.Client.Version}}')" = "${V2_DOCKER_CLI_VERSION}"

            main_sha="$(git rev-parse HEAD)"
            child_image="${V2_CHILD_IMAGE}:${main_sha}"
            docker build --file Dockerfile.gmgn-v2 --tag "${child_image}" .
            run_token="$(printf '%s' "${CNB_BUILD_ID:-${main_sha}}" | sha256sum | cut -c1-12)"
            container="gmgn-v2-cap-${run_token}"
            cleanup() {
              docker rm -f "${container}" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            docker create \
              --name "${container}" \
              --cap-add NET_ADMIN \
              --cap-add SYS_ADMIN \
              "${child_image}" \
              python -m scripts.probe_network_guard_linux preflight \
                --exercise-netns "gmgnv2-cap-${run_token}" \
                --output /work/.cnb-runtime/capabilities.json
            test "$(docker inspect --format '{{json .Mounts}}' "${container}")" = "[]"
            set +e
            docker start --attach "${container}"
            capability_status=$?
            set -e
            if [ "${capability_status}" -ne 0 ]; then
              printf '%s\n' 'Managed runner lacks the required guarded-network capabilities; this lane is a no-op.'
              printf '%s\n' admission-noop > .cnb-runtime/gmgn-v2/admission-noop
              exit 0
            fi
            docker cp "${container}:/work/.cnb-runtime/capabilities.json" \
              .cnb-runtime/gmgn-v2/capabilities.json

        - name: Parse and deduplicate the manual V2 trigger
          timeout: 20m
          script: |
            set -eu
            umask 077
            if test -f .cnb-runtime/gmgn-v2/admission-noop; then exit 0; fi
            python3 -m pip install --user --disable-pip-version-check \
              PyYAML==6.0.3 \
              pycryptodomex==3.23.0
            test -n "${CNB_BRANCH:-}"
            test -n "${CNB_REPO_SLUG:-}"
            mkdir -p .cnb-runtime/gmgn-v2/preflight
            printf '%s\n' preflight > .cnb-runtime/gmgn-v2/current-stage.txt

            python3 -m scripts.cnb_gmgn_v2 trigger \
              --tag "${CNB_BRANCH}" \
              --output .cnb-runtime/gmgn-v2/trigger.json
            source_sha="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/trigger.json", encoding="utf-8"))["source_sha256"])')"
            candidate_commit="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/trigger.json", encoding="utf-8"))["candidate_commit"])')"
            retry="$(python3 -c 'import json; print("true" if json.load(open(".cnb-runtime/gmgn-v2/trigger.json", encoding="utf-8"))["retry"] else "false")')"
            retry_token="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/trigger.json", encoding="utf-8"))["retry_token"] or "")')"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            remote_url="${web_endpoint}/${CNB_REPO_SLUG}.git"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}" clash/clash-linux-amd
            if [ "${retry}" = true ]; then
              env -u GMGN_IDENTITY_HMAC_KEY \
                -u GMGN_IDENTITY_KEY_VERSION \
                -u GMGN_IDENTITY_EPOCH \
                GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                python3 -m scripts.cnb_gmgn_v2 preflight \
                  --source-sha "${source_sha}" \
                  --candidate-commit "${candidate_commit}" \
                  --remote "${remote_url}" \
                  --work-dir .cnb-runtime/gmgn-v2/preflight \
                  --output .cnb-runtime/gmgn-v2/preflight.json \
                  --noop-file .cnb-runtime/gmgn-v2/noop \
                  --retry \
                  --retry-token "${retry_token}"
            else
              env -u GMGN_IDENTITY_HMAC_KEY \
                -u GMGN_IDENTITY_KEY_VERSION \
                -u GMGN_IDENTITY_EPOCH \
                GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                python3 -m scripts.cnb_gmgn_v2 preflight \
                  --source-sha "${source_sha}" \
                  --candidate-commit "${candidate_commit}" \
                  --remote "${remote_url}" \
                  --work-dir .cnb-runtime/gmgn-v2/preflight \
                  --output .cnb-runtime/gmgn-v2/preflight.json \
                  --noop-file .cnb-runtime/gmgn-v2/noop
            fi
            if test -f .cnb-runtime/gmgn-v2/noop; then
              exit 0
            fi

            attempt_id="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/preflight.json", encoding="utf-8"))["attempt_id"])')"
            retry_of="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/preflight.json", encoding="utf-8"))["retry_of"] or "")')"
            retry_token_sha="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/preflight.json", encoding="utf-8"))["retry_token_sha256"] or "")')"
            processed_tip="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/preflight.json", encoding="utf-8"))["processed_tip"] or "absent")')"
            set -- \
              --source-sha "${source_sha}" \
              --attempt-id "${attempt_id}" \
              --state running \
              --remote "${remote_url}" \
              --work-dir .cnb-runtime/gmgn-v2/processed-running \
              --expected-tip "${processed_tip}"
            if [ -n "${retry_of}" ]; then set -- "$@" --retry-of "${retry_of}"; fi
            if [ -n "${retry_token_sha}" ]; then set -- "$@" --retry-token-sha256 "${retry_token_sha}"; fi
            if [ "${processed_tip}" = absent ] && [ -n "${retry_of}" ]; then
              set -- "$@" --allow-missing-primary
            fi
            env -u GMGN_IDENTITY_HMAC_KEY \
              -u GMGN_IDENTITY_KEY_VERSION \
              -u GMGN_IDENTITY_EPOCH \
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              python3 -m scripts.cnb_gmgn_v2 processed "$@"

        - name: Fetch the fixed candidate triple without secrets
          timeout: 10m
          script: |
            set -eu
            umask 077
            if test -f .cnb-runtime/gmgn-v2/admission-noop || \
               test -f .cnb-runtime/gmgn-v2/noop; then
              exit 0
            fi
            printf '%s\n' fetch > .cnb-runtime/gmgn-v2/current-stage.txt
            source_sha="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/trigger.json", encoding="utf-8"))["source_sha256"])')"
            candidate_commit="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/trigger.json", encoding="utf-8"))["candidate_commit"])')"
            main_sha="$(git rev-parse HEAD)"
            candidate_base="${V2_SOURCE_RAW_BASE}/${candidate_commit}"
            child_image="${V2_CHILD_IMAGE}:${main_sha}"
            run_token="$(printf '%s' "${CNB_BUILD_ID:-${main_sha}}" | sha256sum | cut -c1-12)"
            container="gmgn-v2-fetch-${run_token}"
            cleanup() {
              docker rm -f "${container}" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            docker create \
              --name "${container}" \
              "${child_image}" \
              python -m scripts.cnb_gmgn_v2 fetch \
                --profile-url "${candidate_base}/clash.yaml" \
                --status-url "${candidate_base}/status.json" \
                --metadata-url "${candidate_base}/candidate-metadata.json" \
                --expected-candidate-commit "${candidate_commit}" \
                --expected-source-sha "${source_sha}" \
                --output-dir /work/.cnb-runtime/candidate
            if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${container}" \
              | grep -Eq '^(CNB_TOKEN|GMGN_IDENTITY_HMAC_KEY)='; then
              printf '%s\n' 'ERROR: fetch child inherited a forbidden secret.' >&2
              exit 1
            fi
            test "$(docker inspect --format '{{json .Mounts}}' "${container}")" = "[]"
            docker start --attach "${container}"
            mkdir -p .cnb-runtime/gmgn-v2/candidate
            docker cp "${container}:/work/.cnb-runtime/candidate/." \
              .cnb-runtime/gmgn-v2/candidate/

        - name: Prepare the offline identity-bound V2 manifest
          timeout: 10m
          imports:
            - https://cnb.cool/ASD12321_446/aggregator-gmgn-secrets/-/blob/main/secret.yml
          env:
            CNB_TOKEN: ""
            GITHUB_TOKEN: ""
            GIT_ASKPASS: ""
          script: |
            set -eu
            umask 077
            if test -f .cnb-runtime/gmgn-v2/admission-noop || \
               test -f .cnb-runtime/gmgn-v2/noop; then
              exit 0
            fi
            printf '%s\n' identity-config > .cnb-runtime/gmgn-v2/current-stage.txt
            test -n "${GMGN_IDENTITY_HMAC_KEY:-}"
            test -n "${GMGN_IDENTITY_KEY_VERSION:-}"
            test -n "${GMGN_IDENTITY_EPOCH:-}"
            printf '%s\n' prepare > .cnb-runtime/gmgn-v2/current-stage.txt
            source_sha="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/trigger.json", encoding="utf-8"))["source_sha256"])')"
            candidate_commit="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/trigger.json", encoding="utf-8"))["candidate_commit"])')"
            main_sha="$(git rev-parse HEAD)"
            child_image="${V2_CHILD_IMAGE}:${main_sha}"
            run_token="$(printf '%s' "${CNB_BUILD_ID:-${main_sha}}" | sha256sum | cut -c1-12)"
            container="gmgn-v2-identity-${run_token}"
            cleanup() {
              docker rm -f "${container}" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            docker create \
              --name "${container}" \
              --network none \
              --env GMGN_IDENTITY_HMAC_KEY \
              --env GMGN_IDENTITY_KEY_VERSION \
              --env GMGN_IDENTITY_EPOCH \
              "${child_image}" \
              python -m scripts.cnb_gmgn_v2 prepare \
                --profile /work/input/clash.yaml \
                --status /work/input/status.json \
                --metadata /work/input/candidate-metadata.json \
                --preflight /work/input/preflight.json \
                --trigger /work/input/trigger.json \
                --expected-source-sha "${source_sha}" \
                --expected-candidate-commit "${candidate_commit}" \
                --mihomo /opt/aggregator/clash/clash-linux-amd \
                --identity-fixture /opt/aggregator/tests/fixtures/gmgn_identity_v1.json \
                --output-dir /work/.cnb-runtime/prepared \
                --workers "${V2_WORKERS_PER_SHARD}" \
                --max-candidates "${V2_MAX_CANDIDATES}"
            test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "${container}")" = "none"
            test "$(docker inspect --format '{{json .Mounts}}' "${container}")" = "[]"
            if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${container}" \
              | grep -Eq '^CNB_TOKEN='; then
              printf '%s\n' 'ERROR: identity child inherited CNB_TOKEN.' >&2
              exit 1
            fi
            docker cp .cnb-runtime/gmgn-v2/candidate/clash.yaml \
              "${container}:/work/input/clash.yaml"
            docker cp .cnb-runtime/gmgn-v2/candidate/status.json \
              "${container}:/work/input/status.json"
            docker cp .cnb-runtime/gmgn-v2/candidate/candidate-metadata.json \
              "${container}:/work/input/candidate-metadata.json"
            docker cp .cnb-runtime/gmgn-v2/preflight.json \
              "${container}:/work/input/preflight.json"
            docker cp .cnb-runtime/gmgn-v2/trigger.json \
              "${container}:/work/input/trigger.json"
            docker start --attach "${container}"
            mkdir -p .cnb-runtime/gmgn-v2/prepared
            docker cp "${container}:/work/.cnb-runtime/prepared/." \
              .cnb-runtime/gmgn-v2/prepared/

        - name: Probe four guarded GMGN V2 shards in parallel
          jobs:
            shard-0:
              timeout: 300m
              script: |
                set -eu
                umask 077
                if test -f .cnb-runtime/gmgn-v2/admission-noop || test -f .cnb-runtime/gmgn-v2/noop; then exit 0; fi
                printf '%s\n' probe-shard-0 > .cnb-runtime/gmgn-v2/current-stage.txt
                main_sha="$(git rev-parse HEAD)"
                child_image="${V2_CHILD_IMAGE}:${main_sha}"
                run_token="$(printf '%s' "${CNB_BUILD_ID:-${main_sha}}-0" | sha256sum | cut -c1-12)"
                container="gmgn-v2-probe-0-${run_token}"
                cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
                trap cleanup EXIT
                docker create --name "${container}" \
                  --cap-add NET_ADMIN --cap-add SYS_ADMIN \
                  "${child_image}" \
                  python -m scripts.cnb_gmgn_v2 probe \
                    --manifest /work/input/manifest.json \
                    --shard-input /work/input/shard.json \
                    --shard-index 0 \
                    --controller-secret /work/input/controller-secret.txt \
                    --mihomo /opt/aggregator/clash/clash-linux-amd \
                    --output-dir /work/.cnb-runtime/shard-0
                if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${container}" \
                  | grep -Eq '^(CNB_TOKEN|GMGN_IDENTITY_HMAC_KEY)='; then exit 1; fi
                test "$(docker inspect --format '{{json .Mounts}}' "${container}")" = "[]"
                docker cp .cnb-runtime/gmgn-v2/prepared/manifest.json "${container}:/work/input/manifest.json"
                docker cp .cnb-runtime/gmgn-v2/prepared/shards/shard-0.json "${container}:/work/input/shard.json"
                docker cp .cnb-runtime/gmgn-v2/prepared/controller-secrets/shard-0.txt "${container}:/work/input/controller-secret.txt"
                set +e
                docker start --attach "${container}"
                probe_status="$?"
                set -e
                mkdir -p .cnb-runtime/gmgn-v2/shards/shard-0
                if test "${probe_status}" -ne 0; then
                  mkdir -p .cnb-runtime/gmgn-v2/shards/shard-0/safe-diagnostics
                  docker cp "${container}:/work/.cnb-runtime/shard-0/safe-diagnostics/." \
                    .cnb-runtime/gmgn-v2/shards/shard-0/safe-diagnostics/ || true
                  exit "${probe_status}"
                fi
                docker cp "${container}:/work/.cnb-runtime/shard-0/." .cnb-runtime/gmgn-v2/shards/shard-0/
            shard-1:
              timeout: 300m
              script: |
                set -eu
                umask 077
                if test -f .cnb-runtime/gmgn-v2/admission-noop || test -f .cnb-runtime/gmgn-v2/noop; then exit 0; fi
                printf '%s\n' probe-shard-1 > .cnb-runtime/gmgn-v2/current-stage.txt
                main_sha="$(git rev-parse HEAD)"
