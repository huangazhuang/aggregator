main:
  "crontab: 0 10,22 * * *":
    - &github_main_sync
      name: Sync GitHub main to CNB
      runner:
        tags: cnb:arch:amd64
        cpus: 1
      docker:
        image: python:3.12-bookworm
      env:
        GITHUB_MAIN_REPO: https://github.com/huangazhuang/aggregator.git
      stages:
        - name: Fast-forward CNB main from GitHub
          timeout: 10m
          script: |
            set -eu
            test -n "${CNB_TOKEN:-}"
            test -n "${CNB_REPO_SLUG:-}"

            git fetch --no-tags "${GITHUB_MAIN_REPO}" main
            github_sha="$(git rev-parse FETCH_HEAD)"
            cnb_sha="$(git rev-parse HEAD)"
            if [ "${github_sha}" = "${cnb_sha}" ]; then
              printf 'CNB main is already up to date: %s\n' "${github_sha}"
              exit 0
            fi

            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git push "${web_endpoint}/${CNB_REPO_SLUG}.git" "FETCH_HEAD:refs/heads/main"
            printf 'CNB main fast-forwarded: %s -> %s\n' "${cnb_sha}" "${github_sha}"

  "crontab: 30 10,22 * * *":
    - &china_probe
      name: Mainland China Mihomo probe
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12-bookworm
      env:
        SOURCE_PROFILE_URL: https://raw.githubusercontent.com/huangazhuang/aggregator/clash-verge-output/clash.yaml
        SOURCE_STATUS_URL: https://raw.githubusercontent.com/huangazhuang/aggregator/clash-verge-output/status.json
        TARGET_URL: https://www.gstatic.com/generate_204
        EXPECTED_STATUS: "204"
        OUTPUT_BRANCH: clash-cn-output
        PRELIMINARY_ROUNDS: "3"
        TOTAL_ROUNDS: "20"
        ROUND_GAP_SECONDS: "0.75"
        BASE_TARGET: "80"
        MAX_NODES: "150"
        NON_ASIA_MIN: "10"
        NON_ASIA_MAX: "20"
        MIN_SUCCESS_RATE: "0.70"
        BASE_PREFERRED_SUCCESS_RATE: "0.80"
        ELITE_MIN_SUCCESS_RATE: "0.90"
        MAX_QUALIFIED_P90_MS: "2800"
        ELITE_MAX_P90_MS: "2000"
        MIN_SUCCESS: "80"
        MIN_RETAIN_RATIO: "0.50"
        TIMEOUT_MS: "3000"
      stages:
        - name: Test proxies from the CNB runner
          timeout: 50m
          script: |
            set -eu
            python3 -m pip install --user --disable-pip-version-check PyYAML==6.0.2
            chmod +x clash/clash-linux-amd
            mkdir -p .cnb-runtime public-cn
            test -n "${CNB_REPO_SLUG:-}"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            previous_status_url="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${OUTPUT_BRANCH}/status.json"
            main_sha="$(git rev-parse HEAD)"
            python3 -m scripts.cnb_mihomo_filter \
              --source "${SOURCE_PROFILE_URL}" \
              --source-status "${SOURCE_STATUS_URL}" \
              --previous-status "${previous_status_url}" \
              --main-sha "${main_sha}" \
              --mihomo clash/clash-linux-amd \
              --work-dir .cnb-runtime \
              --output-dir public-cn \
              --target-url "${TARGET_URL}" \
              --expected-status "${EXPECTED_STATUS}" \
              --timeout-ms "${TIMEOUT_MS}" \
              --preliminary-rounds "${PRELIMINARY_ROUNDS}" \
              --total-rounds "${TOTAL_ROUNDS}" \
              --round-gap "${ROUND_GAP_SECONDS}" \
              --workers 48 \
              --base-target "${BASE_TARGET}" \
              --max-nodes "${MAX_NODES}" \
              --non-asia-min "${NON_ASIA_MIN}" \
              --non-asia-max "${NON_ASIA_MAX}" \
              --min-success-rate "${MIN_SUCCESS_RATE}" \
              --base-preferred-success-rate "${BASE_PREFERRED_SUCCESS_RATE}" \
              --elite-min-success-rate "${ELITE_MIN_SUCCESS_RATE}" \
              --max-qualified-p90-ms "${MAX_QUALIFIED_P90_MS}" \
              --elite-max-p90-ms "${ELITE_MAX_P90_MS}" \
              --min-success "${MIN_SUCCESS}" \
              --min-retain-ratio "${MIN_RETAIN_RATIO}"

        - name: Publish the filtered profile to CNB
          timeout: 5m
          script: |
            set -eu
            test -n "${CNB_TOKEN:-}"
            test -n "${CNB_REPO_SLUG:-}"

            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            profile_url="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/${OUTPUT_BRANCH}/clash.yaml"
            python3 -m scripts.prepare_cnb_publish \
              --output-dir public-cn \
              --profile-url "${profile_url}"

            mkdir -p .cnb-runtime/publish
            cp public-cn/clash.yaml .cnb-runtime/publish/clash.yaml
            cp public-cn/status.json .cnb-runtime/publish/status.json
            cp public-cn/probe-results.json .cnb-runtime/publish/probe-results.json
            cp public-cn/README.md .cnb-runtime/publish/README.md

            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            cd .cnb-runtime/publish
            git init
            git checkout -b "${OUTPUT_BRANCH}"
            git config user.name "cnb-probe[bot]"
            git config user.email "cnb-probe@users.noreply.cnb.cool"
            git add README.md clash.yaml status.json probe-results.json
            git commit -m "Update mainland-China tested Clash profile"

            GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              git push --force "${web_endpoint}/${CNB_REPO_SLUG}.git" "HEAD:${OUTPUT_BRANCH}"
            printf 'Subscription URL: %s\n' "${profile_url}"

  web_trigger_china_probe:
    - *china_probe

  web_trigger_sync_github:
    - *github_main_sync
