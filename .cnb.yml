                if test "${probe_status}" -ne 0; then
                  mkdir -p .cnb-runtime/gmgn-v2/shards/shard-2/safe-diagnostics
                  docker cp "${container}:/work/.cnb-runtime/shard-2/safe-diagnostics/." \
                    .cnb-runtime/gmgn-v2/shards/shard-2/safe-diagnostics/ || true
                  exit "${probe_status}"
                fi
                docker cp "${container}:/work/.cnb-runtime/shard-2/." .cnb-runtime/gmgn-v2/shards/shard-2/
            shard-3:
              timeout: 300m
              script: |
                set -eu
                umask 077
                if test -f .cnb-runtime/gmgn-v2/admission-noop || test -f .cnb-runtime/gmgn-v2/noop; then exit 0; fi
                printf '%s\n' probe-shard-3 > .cnb-runtime/gmgn-v2/current-stage.txt
                main_sha="$(git rev-parse HEAD)"
                child_image="${V2_CHILD_IMAGE}:${main_sha}"
                run_token="$(printf '%s' "${CNB_BUILD_ID:-${main_sha}}-3" | sha256sum | cut -c1-12)"
                container="gmgn-v2-probe-3-${run_token}"
                cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
                trap cleanup EXIT
                docker create --name "${container}" \
                  --cap-add NET_ADMIN --cap-add SYS_ADMIN \
                  "${child_image}" \
                  python -m scripts.cnb_gmgn_v2 probe \
                    --manifest /work/input/manifest.json \
                    --shard-input /work/input/shard.json \
                    --shard-index 3 \
                    --controller-secret /work/input/controller-secret.txt \
                    --mihomo /opt/aggregator/clash/clash-linux-amd \
                    --output-dir /work/.cnb-runtime/shard-3
                if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${container}" \
                  | grep -Eq '^(CNB_TOKEN|GMGN_IDENTITY_HMAC_KEY)='; then exit 1; fi
                test "$(docker inspect --format '{{json .Mounts}}' "${container}")" = "[]"
                docker cp .cnb-runtime/gmgn-v2/prepared/manifest.json "${container}:/work/input/manifest.json"
                docker cp .cnb-runtime/gmgn-v2/prepared/shards/shard-3.json "${container}:/work/input/shard.json"
                docker cp .cnb-runtime/gmgn-v2/prepared/controller-secrets/shard-3.txt "${container}:/work/input/controller-secret.txt"
                set +e
                docker start --attach "${container}"
                probe_status="$?"
                set -e
                mkdir -p .cnb-runtime/gmgn-v2/shards/shard-3
                if test "${probe_status}" -ne 0; then
                  mkdir -p .cnb-runtime/gmgn-v2/shards/shard-3/safe-diagnostics
                  docker cp "${container}:/work/.cnb-runtime/shard-3/safe-diagnostics/." \
                    .cnb-runtime/gmgn-v2/shards/shard-3/safe-diagnostics/ || true
                  exit "${probe_status}"
                fi
                docker cp "${container}:/work/.cnb-runtime/shard-3/." .cnb-runtime/gmgn-v2/shards/shard-3/

        - name: Redact measurements and exit identity offline
          timeout: 10m
          imports:
            - https://cnb.cool/ASD12321_446/aggregator-gmgn-secrets/-/blob/main/secret.yml
          env:
            CNB_TOKEN: ""
            GITHUB_TOKEN: ""
            GIT_ASKPASS: ""
          script: |
            set -eu
            umask 077
            if test -f .cnb-runtime/gmgn-v2/admission-noop || test -f .cnb-runtime/gmgn-v2/noop; then exit 0; fi
            printf '%s\n' redact > .cnb-runtime/gmgn-v2/current-stage.txt
            test -n "${GMGN_IDENTITY_HMAC_KEY:-}"
            test -n "${GMGN_IDENTITY_KEY_VERSION:-}"
            test -n "${GMGN_IDENTITY_EPOCH:-}"
            main_sha="$(git rev-parse HEAD)"
            child_image="${V2_CHILD_IMAGE}:${main_sha}"
            run_token="$(printf '%s' "${CNB_BUILD_ID:-${main_sha}}-redact" | sha256sum | cut -c1-12)"
            container="gmgn-v2-redact-${run_token}"
            cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            docker create --name "${container}" --network none \
              --env GMGN_IDENTITY_HMAC_KEY \
              --env GMGN_IDENTITY_KEY_VERSION \
              --env GMGN_IDENTITY_EPOCH \
              "${child_image}" \
              python -m scripts.cnb_gmgn_v2 redact \
                --manifest /work/input/manifest.json \
                --shard-root /work/input/shards \
                --identity-fixture /opt/aggregator/tests/fixtures/gmgn_identity_v1.json \
                --output-dir /work/.cnb-runtime/redacted
            test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "${container}")" = "none"
            test "$(docker inspect --format '{{json .Mounts}}' "${container}")" = "[]"
            if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${container}" \
              | grep -Eq '^CNB_TOKEN='; then exit 1; fi
            docker cp .cnb-runtime/gmgn-v2/prepared/manifest.json "${container}:/work/input/manifest.json"
            docker cp .cnb-runtime/gmgn-v2/shards "${container}:/work/input/shards"
            docker start --attach "${container}"
            mkdir -p .cnb-runtime/gmgn-v2/redacted
            docker cp "${container}:/work/.cnb-runtime/redacted/." .cnb-runtime/gmgn-v2/redacted/

        - name: Finalize and locally validate one immutable V2 bundle
          timeout: 15m
          script: |
            set -eu
            umask 077
            if test -f .cnb-runtime/gmgn-v2/admission-noop || test -f .cnb-runtime/gmgn-v2/noop; then exit 0; fi
            printf '%s\n' finalize > .cnb-runtime/gmgn-v2/current-stage.txt
            test -n "${CNB_REPO_SLUG:-}"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            remote_url="${web_endpoint}/${CNB_REPO_SLUG}.git"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            env -u GMGN_IDENTITY_HMAC_KEY \
              -u GMGN_IDENTITY_KEY_VERSION \
              -u GMGN_IDENTITY_EPOCH \
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              python3 -m scripts.cnb_gmgn_v2 finalize \
                --manifest .cnb-runtime/gmgn-v2/prepared/manifest.json \
                --snapshot .cnb-runtime/gmgn-v2/prepared/snapshot.json \
                --redacted-root .cnb-runtime/gmgn-v2/redacted \
                --private-shard-root .cnb-runtime/gmgn-v2/shards \
                --shard-input-root .cnb-runtime/gmgn-v2/prepared/shards \
                --remote "${remote_url}" \
                --work-dir .cnb-runtime/gmgn-v2/finalize-work \
                --bundle-dir .cnb-runtime/gmgn-v2/bundle \
                --previous-tip-file .cnb-runtime/gmgn-v2/previous-tip.txt \
                --noop-file .cnb-runtime/gmgn-v2/noop
            if test -f .cnb-runtime/gmgn-v2/noop; then exit 0; fi
            env -u GMGN_IDENTITY_HMAC_KEY \
              -u GMGN_IDENTITY_KEY_VERSION \
              -u GMGN_IDENTITY_EPOCH \
              -u CNB_TOKEN \
              -u GITHUB_TOKEN \
              -u GIT_ASKPASS \
              python3 -m scripts.validate_public_outputs run \
                --bundle-dir .cnb-runtime/gmgn-v2/bundle \
                --mihomo clash/clash-linux-amd \
                --evidence-dir .cnb-runtime/gmgn-v2/local-validation

        - name: Transactionally publish only the V2 shadow branch
          timeout: 30m
          script: |
            set -eu
            umask 077
            if test -f .cnb-runtime/gmgn-v2/admission-noop || test -f .cnb-runtime/gmgn-v2/noop; then exit 0; fi
            printf '%s\n' publish > .cnb-runtime/gmgn-v2/current-stage.txt
            test -n "${CNB_TOKEN:-}"
            test -n "${CNB_REPO_SLUG:-}"
            web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
            remote_url="${web_endpoint}/${CNB_REPO_SLUG}.git"
            raw_template="${web_endpoint}/${CNB_REPO_SLUG}/-/git/raw/{revision}"
            askpass="$(pwd)/scripts/cnb_git_askpass.sh"
            chmod +x "${askpass}"
            expected_tip="$(tr -d '\r\n' < .cnb-runtime/gmgn-v2/previous-tip.txt)"
            env -u GMGN_IDENTITY_HMAC_KEY \
              -u GMGN_IDENTITY_KEY_VERSION \
              -u GMGN_IDENTITY_EPOCH \
              GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
              python3 -m scripts.publish_transaction publish \
                --bundle-dir .cnb-runtime/gmgn-v2/bundle \
                --remote "${remote_url}" \
                --raw-base-template "${raw_template}" \
                --work-dir .cnb-runtime/gmgn-v2/publish-work \
                --mihomo clash/clash-linux-amd \
                --expected-previous-tip "${expected_tip}" \
                --branch "${V2_OUTPUT_BRANCH}"
            printf 'GMGN V2 shadow bundle: %s/%s/-/git/raw/%s/status.json\n' \
              "${web_endpoint}" "${CNB_REPO_SLUG}" "${V2_OUTPUT_BRANCH}"

      failStages:
        - name: Report a safe V2 failure category
          timeout: 2m
          script: |
            set -eu
            stage=preflight
            if test -s .cnb-runtime/gmgn-v2/current-stage.txt; then
              stage="$(tr -cd 'A-Za-z0-9._\n-' < .cnb-runtime/gmgn-v2/current-stage.txt | head -n 1)"
            fi
            printf 'GMGN V2 shadow failed closed at safe stage category: %s\n' "${stage:-unknown}"
            printf '%s\n' 'No private fragment, proxy configuration, raw region, token, or identity key was published.'
            if test -s .cnb-runtime/gmgn-v2/preflight.json && \
               ! test -f .cnb-runtime/gmgn-v2/noop && \
               test -n "${CNB_TOKEN:-}" && test -n "${CNB_REPO_SLUG:-}"; then
              web_endpoint="${CNB_WEB_ENDPOINT:-https://cnb.cool}"
              remote_url="${web_endpoint}/${CNB_REPO_SLUG}.git"
              askpass="$(pwd)/scripts/cnb_git_askpass.sh"
              chmod +x "${askpass}"
              source_sha="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/preflight.json", encoding="utf-8"))["source_sha256"])')"
              attempt_id="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/preflight.json", encoding="utf-8"))["attempt_id"])')"
              retry_of="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/preflight.json", encoding="utf-8"))["retry_of"] or "")')"
              retry_token_sha="$(python3 -c 'import json; print(json.load(open(".cnb-runtime/gmgn-v2/preflight.json", encoding="utf-8"))["retry_token_sha256"] or "")')"
              processed_state=rejected
              case "${stage:-unknown}" in
                preflight|identity-config|prepare|fetch|probe-shard-*|redact|finalize|publish) processed_state=failed_infrastructure ;;
              esac
              set -- \
                --source-sha "${source_sha}" \
                --attempt-id "${attempt_id}" \
                --state "${processed_state}" \
                --remote "${remote_url}" \
                --work-dir .cnb-runtime/gmgn-v2/processed-failed
              if [ -n "${retry_of}" ]; then set -- "$@" --retry-of "${retry_of}"; fi
              if [ -n "${retry_token_sha}" ]; then set -- "$@" --retry-token-sha256 "${retry_token_sha}"; fi
              env -u GMGN_IDENTITY_HMAC_KEY -u GMGN_IDENTITY_KEY_VERSION -u GMGN_IDENTITY_EPOCH \
                GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
                python3 -m scripts.cnb_gmgn_v2 processed "$@" || \
                printf '%s\n' 'WARNING: processed-state failure transition could not be recorded.' >&2
            fi

  web_trigger_cnb_runner_capabilities:
    - &cnb_runner_capabilities
      name: Diagnose managed CNB Docker isolation primitives
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: python:3.12-bookworm
      services: [docker]
      lock:
        key: aggregator-cnb-capability-diagnostic
        expires: 900
        wait: true
        timeout: 900
        cancel-in-progress: false
      env:
        CAPABILITY_DOCKER_CLI_VERSION: "27.5.1"
        CAPABILITY_DOCKER_CLI_SHA256: 4f798b3ee1e0140eab5bf30b0edc4e84f4cdb53255a429dc3bbae9524845d640
        CAPABILITY_DOCKER_CLI_DIR: .cnb-runtime/capability-diagnostic/docker-cli
        PATH: .cnb-runtime/capability-diagnostic/docker-cli:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      stages:
        - name: Inspect effective child capabilities without repository secrets
          timeout: 10m
          script: |
            set -eu
            umask 077
            mkdir -p "${CAPABILITY_DOCKER_CLI_DIR}"
            docker_archive=".cnb-runtime/capability-diagnostic/docker-${CAPABILITY_DOCKER_CLI_VERSION}.tgz"
            python3 - "${CAPABILITY_DOCKER_CLI_VERSION}" "${docker_archive}" <<'PY'
            import pathlib
            import sys
            import urllib.request

            version, destination = sys.argv[1:]
            url = f"https://download.docker.com/linux/static/stable/x86_64/docker-{version}.tgz"
            pathlib.Path(destination).write_bytes(urllib.request.urlopen(url, timeout=120).read())
            PY
            printf '%s  %s\n' "${CAPABILITY_DOCKER_CLI_SHA256}" "${docker_archive}" | sha256sum -c -
            tar -xzf "${docker_archive}" --strip-components=1 \
              -C "${CAPABILITY_DOCKER_CLI_DIR}" docker/docker
            chmod 0755 "${CAPABILITY_DOCKER_CLI_DIR}/docker"
            command -v docker >/dev/null
            test "$(docker version --format '{{.Client.Version}}')" = "${CAPABILITY_DOCKER_CLI_VERSION}"

            main_sha="$(git rev-parse HEAD)"
            diagnostic_image="aggregator-cnb-capability:${main_sha}"
            docker build --file Dockerfile.gmgn-v2 --tag "${diagnostic_image}" .
            env -u CNB_TOKEN \
              -u GITHUB_TOKEN \
              -u GIT_ASKPASS \
              -u GMGN_IDENTITY_HMAC_KEY \
              -u GMGN_IDENTITY_KEY_VERSION \
              -u GMGN_IDENTITY_EPOCH \
              python3 -m scripts.cnb_runner_capabilities outer \
                --image "${diagnostic_image}"

  web_trigger_china_probe:
    - *china_probe

  web_trigger_sync_github:
    - *github_main_sync

"cnb-probe-*":
  tag_push:
    - *china_probe

"cnb-gmgn-shadow-*":
  tag_push:
    - *gmgn_shadow

"cnb-gmgn-v2-*":
  tag_push:
    - *gmgn_v2_shadow

"cnb-runner-capability-*":
  tag_push:
    - *cnb_runner_capabilities
